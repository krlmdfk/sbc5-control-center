name: SBC5 Control Center
version: 3.1.10
slug: sbc5_control_center
description: "SBC5 Control Center 3.1.10 — Expose AI Cooling v5 hierarchical direct/global/effective diagnostics and reduce duplicate Restart Manager cleanup noise without changing cooling control."
