###############################################################################
# RASPBERRY PI 5 ACTIVE COOLER
# SBC5 Control Center Package Version: 3.1.14
# 2.6.24: APP_VERSION import + package-version sensor + non-destructive namespace recovery.
# 2.6.23: native integration bootstrap recovery; runtime cooling/AI logic unchanged.
# 2.6.7: Workload Buckets v2 — 30 s moving average, progi 10/30/60%, histereza ±5 pp i diagnostyka kwalifikacji
# 2.6.4: Native Mushroom Multiline — multiline_secondary=true eliminuje natywne obcinanie tekstu w aktualnym template-card
# 2.6.3: Mobile Text Wrap — dynamiczna wysokość kafli, pełne zawijanie treści i wyższe akcje 2-kolumnowe na telefonie
# 2.6.2: AI Grid Apply — pokrycie modelu, realne zagęszczenie 0,25°C oraz bezpieczne Zastosuj/Cofnij
# 2.6.1: Mobile UI Stability + AI Grid Density Advisor — bezpieczne karty bez more-info dla telemetryki realtime; pasywna sugestia zagęszczenia siatki
# 2.5.9: Calibration Card Recovery — uproszczone szablony + pełna weryfikacja integralności Lovelace
# 2.5.7: Template Hotfix — kompatybilny parser HA dla karty kalibracji Active Cooler
# 2.5.3: AI Dashboard Integration — główna karta zawiera zweryfikowany panel AI oraz Card UI v2.5.3
# 2.5.2: AI Adaptive Cooling Preview — Learning + bounded AI Assist; klasyczny Adaptive PWM pozostaje fallbackiem
# 2.4.2: przełączniki aktywacji sekcji są rozdzielone i umieszczone bezpośrednio przed odpowiadającymi grupami konfiguracji
# 2.3.0: Active Cooler control modes — Automatic / Hybrid / Manual
# 2.2.0: single-profile UI + legacy profile cleanup
# 2.1.8: Adaptive anti-windup + deadband 0,75°C + canonical runtime diagnostics sync
# 2.1.6: fallback thermal mode=disabled bez governor user_space + automatyczne przywracanie kernela + safety handoff
# 2.1.3: Adaptive PWM od rzeczywistego cur_state + postęp i weryfikacja kalibracji
# 2.1.0: siatka PWM 1% + automatyczna kalibracja Active Cooler (AI-ready)
# 2.0.3: Balanced Adaptive PWM + łagodna charakterystyka powyżej setpointu
# 2.0.2: Adaptive PWM / Auto-Trim + stabilizacja temperatury zadanej
# 2.0.0: wymagania platformy + dwie kanoniczne karty + zoptymalizowany runtime
# 1.9.25: wizualizacja aktywnego punktu pracy i rzeczywistego zagęszczenia krzywej
# 1.9.23: CPU Usage na Pulpicie + Adaptive Setpoint Density dla 5 własnych krzywych
# 1.9.22: Restart State Machine — niezawodne zamykanie restartu i czyszczenie Repairs po aktualizacji
# 1.9.18: factory defaults + per-parameter reset + synchronized profile/curve names + UX optimization
# 1.9.17: graficzny edytor 5 krzywych (15 punktów) + Complete UX Dashboard
# 1.9.14: canonical project directories + multicore profiler;
# 1.9.10: zoptymalizowane Info, Dokumentacja i opisy Konfiguracji; runtime bez zmian
# 1.9.8: GitHub/HACS-style Info + uporządkowana dokumentacja i walidacja projektu
# 1.9.7: Info + kompletna dokumentacja krok po kroku
# 1.9.6: balanced telemetry 5 s + sensory 4 rdzeni (MHz i użycie %) + wykres 5 s/10 s
# 1.9.4: realtime CPU temperature / RPM / PWM co 1 s przez lekki plik JSON
# 1.9.3: CPU Spike Fix — optymalizacja pętli i rozłożenie ciężkiej diagnostyki
# 1.9.1: pełny Config.txt Manager + bloki/opisy/zakresy + katalog parametrów
# 1.7.10: hotfix host/config.txt + kanoniczne encje + bezpieczny fallback dashboard
# 1.7.9: bezpieczna konfiguracja CPU/USB + osobny blok config.txt + backup/restore
# 1.7.8: naprawa Host Access + SYS_PTRACE + Host Probe /mnt/boot
# 1.7.7: dostęp host PID do /mnt/boot + fallback nsenter + zachowanie 1.7.6
###############################################################################

