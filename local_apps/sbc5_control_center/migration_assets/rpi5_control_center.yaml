automation:
  - id: sbc5_single_stable_curve_focus_on_panel
    alias: "SBC5 - pojedyncza krzywa po otwarciu edytora"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.sbc5_cc_panel
        to: "Edytor krzywych"
    action:
      - action: script.sbc5_single_stable_curve_focus

  - id: sbc5_fan_mobile_restart_action
    alias: "SBC5 - obsługa przycisku restartu z powiadomienia"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.action in ['RPI5_RESTART_HA', 'RPI5_REBOOT_HOST', 'RPI5_RESTART_LATER', 'RPI5_INSTALL_LOCAL_UPDATE'] }}
    actions:
      - choose:
          - conditions: "{{ trigger.event.data.action == 'RPI5_RESTART_HA' }}"
            sequence:
              - action: script.sbc5_fan_restart_home_assistant_confirmed
          - conditions: "{{ trigger.event.data.action == 'RPI5_REBOOT_HOST' }}"
            sequence:
              - action: script.sbc5_fan_reboot_host_confirmed
          - conditions: "{{ trigger.event.data.action == 'RPI5_RESTART_LATER' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: sbc5_fan_restart_deferred
                  title: "SBC5 Control Center"
                  message: >-
                    Restart został odłożony. Restart Manager nadal będzie wskazywał
                    wymaganą akcję do czasu jej wykonania.
          - conditions: "{{ trigger.event.data.action == 'RPI5_INSTALL_LOCAL_UPDATE' }}"
            sequence:
              - action: script.sbc5_fan_install_local_update_confirmed


  - id: sbc5_fan_profile_selection_sync
    alias: "SBC5 - utrzymuj selektor na profilu żądanym"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: state
        entity_id: sensor.sbc5_requested_fan_profile
        id: desired_changed
      - trigger: state
        entity_id: input_select.sbc5_cc_panel
        to: "Chłodzenie"
        id: cooling_opened
    actions:
      - if:
          - condition: trigger
            id: ha_start
        then:
          - delay: "00:00:08"
      - action: script.sbc5_fan_sync_selected_profile

  - id: sbc5_cpu_oc_profile_selector_sync
    alias: "SBC5 - synchronizuj kartę z aktywnym profilem CPU / OC"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: state
        entity_id: sensor.sbc5_cpu_oc_profile
        id: profile_changed
    actions:
      - if:
          - condition: trigger
            id: ha_start
        then:
          - delay: "00:00:08"
      - action: script.sbc5_cpu_oc_sync_selector

  - id: sbc5_gpu_profile_selector_sync
    alias: "SBC5 - synchronizuj kartę z aktywnym profilem GPU / V3D / ISP"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: state
        entity_id: sensor.sbc5_gpu_profile
        id: profile_changed
    actions:
      - if:
          - condition: trigger
            id: ha_start
        then:
          - delay: "00:00:08"
      - action: script.sbc5_gpu_sync_selector

  - id: sbc5_curve_editor_selection_sync
    alias: "SBC5 Curve Editor - synchronizuj wybór"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.sbc5_curve_editor_curve
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:02"
      - action: script.sbc5_curve_editor_load_curve

  - id: sbc5_curve_editor_point_sync
    alias: "SBC5 Curve Editor - synchronizuj punkt"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.sbc5_curve_editor_point
    actions:
      - action: script.sbc5_curve_editor_load_point


###############################################################################
# INTERNAL TRANSPORT SENSORS — nie zapisuj do Recorder
# Te encje zmieniają się co kilka sekund i służą wyłącznie jako relay backend -> HA.
###############################################################################
recorder:
  exclude:
    entities:
      - sensor.sbc5_control_center_host_telemetry
      - sensor.sbc5_control_center_ai_runtime
