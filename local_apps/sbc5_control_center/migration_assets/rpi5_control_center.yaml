template:
  - sensor:


      # AI Thermal Predictor entities are native integration sensors since 3.1.14.
      - name: SBC5 AI Prediction PWM
        unique_id: sbc5_ai_prediction_pwm
        icon: mdi:chart-bell-curve-cumulative
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('prediction_available', false) and ai.get('prediction_pwm_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai.get('prediction_pwm_percent', 0) | float(0) | round(1) if ai is mapping else 0 }}
        attributes:
          workload_bucket: >-
            {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
            {{ ai.get('workload_bucket', 'unknown') if ai is mapping else 'unknown' }}
          ai_state: >-
            {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
            {{ ai.get('state', 'unknown') if ai is mapping else 'unknown' }}

      - name: SBC5 AI Baseline PWM
        unique_id: sbc5_ai_baseline_pwm
        icon: mdi:chart-line
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('baseline_pwm_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai.get('baseline_pwm_percent', 0) | float(0) | round(1) if ai is mapping else 0 }}

      - name: SBC5 AI Correction PWM
        unique_id: sbc5_ai_correction_pwm
        icon: mdi:plus-minus-variant
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('correction_pwm_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai.get('correction_pwm_percent', 0) | float(0) | round(1) if ai is mapping else 0 }}

      - name: SBC5 AI Physical PWM
        unique_id: sbc5_ai_physical_pwm
        icon: mdi:fan-speed-2
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('current_pwm_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai.get('current_pwm_percent', 0) | float(0) | round(1) if ai is mapping else 0 }}

      - name: SBC5 AI Confidence
        unique_id: sbc5_ai_confidence
        icon: mdi:brain
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('confidence_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai.get('confidence_percent', 0) | float(0) | round(1) if ai is mapping else 0 }}
      - name: SBC5 Package Version
        unique_id: sbc5_package_version
        icon: mdi:package-variant-closed-check
        state: "3.1.14"

      - name: SBC5 CPU OC Profile
        unique_id: sbc5_cpu_oc_profile
        icon: mdi:speedometer
        availability: >-
          {{ states('input_select.sbc5_cpu_oc_profile') not in ['unknown','unavailable','none','']
             or states('sensor.sbc5_overclock_status') not in ['unknown','unavailable'] }}
        state: >-
          {% set selected = states('input_select.sbc5_cpu_oc_profile') %}
          {% if selected not in ['unknown','unavailable','none',''] %}
            {{ selected }}
          {% else %}
            {% set saved = state_attr('sensor.sbc5_overclock_status','saved_arm_freq_mhz') | int(0) %}
            {{ 'OC Łagodny · 2500 MHz' if saved == 2500 else 'OC Zbalansowany · 2600 MHz' if saved == 2600 else 'OC Wydajność · 2800 MHz' if saved == 2800 else 'OC 3.0 GHz · 3000 MHz' if saved == 3000 else 'Fabryczny · 2400 MHz' if saved == 0 else 'Zaawansowany · ustawienia ręczne' }}
          {% endif %}
        attributes:
          profile_code: >-
            {% set selected = states('input_select.sbc5_cpu_oc_profile') %}
            {% set codes = {
              'Fabryczny · 2400 MHz':'factory',
              'OC Łagodny · 2500 MHz':'mild',
              'OC Zbalansowany · 2600 MHz':'balanced',
              'OC Wydajność · 2800 MHz':'performance',
              'OC 3.0 GHz · 3000 MHz':'experimental',
              'Zaawansowany · ustawienia ręczne':'advanced'
            } %}
            {{ codes.get(selected, 'factory') }}
          source_of_truth: persistent_profile_state
          saved_mhz: "{{ state_attr('sensor.sbc5_overclock_status','saved_arm_freq_mhz') | default(0, true) }}"
          runtime_mhz: "{{ state_attr('sensor.sbc5_overclock_status','runtime_max_mhz') | default(0, true) }}"
          runtime_matches_requested: >-
            {% set selected = states('input_select.sbc5_cpu_oc_profile') %}
            {% set codes = {
              'Fabryczny · 2400 MHz':'factory',
              'OC Łagodny · 2500 MHz':'mild',
              'OC Zbalansowany · 2600 MHz':'balanced',
              'OC Wydajność · 2800 MHz':'performance',
              'OC 3.0 GHz · 3000 MHz':'experimental',
              'Zaawansowany · ustawienia ręczne':'advanced'
            } %}
            {% set p = codes.get(selected, 'factory') %}
            {% set runtime = state_attr('sensor.sbc5_overclock_status','runtime_max_mhz') | int(0) %}
            {% set expected = {'factory':2400,'mild':2500,'balanced':2600,'performance':2800,'experimental':3000}.get(p) %}
            {{ expected is none or (p == 'factory' and runtime <= 2400) or runtime == expected }}
          restart_required: "{{ is_state('sensor.sbc5_restart_required','host') or is_state('binary_sensor.sbc5_config_pending_restart','on') }}"

      - name: SBC5 GPU Profile
        unique_id: sbc5_gpu_profile
        icon: mdi:expansion-card-variant
        availability: >-
          {{ states('input_select.sbc5_gpu_profile') not in ['unknown','unavailable','none',''] }}
        state: "{{ states('input_select.sbc5_gpu_profile') }}"
        attributes:
          profile_code: >-
            {% set selected = states('input_select.sbc5_gpu_profile') %}
            {% set codes = {
              'Fabryczny · Auto':'factory',
              'Eco · 850 / 850 / 900 MHz':'eco',
              'Zbalansowany · 950 / 950 / 1000 MHz':'balanced',
              'Wydajność · 1000 / 1000 / 1100 MHz':'performance',
              'Eksperymentalny · 1100 / 1100 / 1200 MHz':'experimental',
              'Zaawansowany · ustawienia ręczne':'advanced'
            } %}
            {{ codes.get(selected, 'factory') }}
          restart_required: "{{ is_state('sensor.sbc5_restart_required','host') or is_state('binary_sensor.sbc5_config_pending_restart','on') }}"
          reference_core_mhz: 910
          reference_isp_mhz: 910
          reference_v3d_mhz: 960

      - name: SBC5 Control Center UX Status
        unique_id: sbc5_control_center_ux_status
        icon: mdi:view-dashboard-edit-outline
        state: >-
          {% set required = [
            'input_select.sbc5_cc_panel',
            'input_select.sbc5_fan_profile',
            'input_select.sbc5_cpu_oc_profile',
            'input_select.sbc5_gpu_profile',
            'input_select.sbc5_curve_editor_curve',
            'input_select.sbc5_curve_editor_point',
            'input_select.sbc5_curve_editor_response_mode',
            'input_text.sbc5_curve_editor_name',
            'input_number.sbc5_curve_editor_target_c',
            'script.sbc5_curve_editor_refresh',
            'script.sbc5_curve_editor_save_template',
            'script.sbc5_curve_editor_apply_selected',
            'sensor.sbc5_cpu_temperature',
            'sensor.sbc5_cpu_usage',
            'sensor.sbc5_cpu_oc_profile',
            'script.sbc5_cpu_oc_apply_profile',
            'sensor.sbc5_gpu_profile',
            'script.sbc5_gpu_apply_profile',
            'sensor.sbc5_fan_percent',
            'sensor.sbc5_fan_level',
            'sensor.sbc5_active_fan_profile',
            'sensor.sbc5_requested_fan_profile',
            'sensor.sbc5_fan_profile_activation',
            'sensor.sbc5_ai_confidence',
            'sensor.sbc5_ai_bucket_maturity',
            'sensor.sbc5_ai_observations',
            'sensor.sbc5_ai_model_coverage',
            'sensor.sbc5_ai_workload',
            'sensor.sbc5_ai_stable_seconds',
            'sensor.sbc5_ai_grid_coverage',
            'sensor.sbc5_package_version'
          ] %}
          {% set ns = namespace(missing=[]) %}
          {% for e in required %}
            {% if states(e) in ['unknown','unavailable'] %}{% set ns.missing = ns.missing + [e] %}{% endif %}
          {% endfor %}
          {% set app = state_attr('sensor.sbc5_control_center_update','installed_version') | default('', true) | string %}
          {% set package = states('sensor.sbc5_package_version') %}
          {% if ns.missing | count > 0 %}
            degraded
          {% elif app not in ['', 'unknown', 'unavailable', 'None'] and package not in ['', 'unknown', 'unavailable'] and app != package %}
            restart_required
          {% elif states('sensor.sbc5_control_center_curve_editor') in ['unknown','unavailable'] or states('sensor.sbc5_curve_editor_runtime') in ['unknown','unavailable'] %}
            waiting
          {% else %}
            ready
          {% endif %}
        attributes:
          app_version: "{{ state_attr('sensor.sbc5_control_center_update','installed_version') | default('—', true) }}"
          package_version: "{{ states('sensor.sbc5_package_version') }}"
          curve_editor_state: "{{ states('sensor.sbc5_control_center_curve_editor') }}"
          panel_helper: "{{ states('input_select.sbc5_cc_panel') }}"
          note: >-
            ready = helpery, skrypty i podstawowa telemetria UX są dostępne; restart_required = aplikacja/package mają różne wersje;
            degraded = brakuje wymaganej encji lub skryptu; waiting = oczekiwanie na publikację danych edytora.


      - name: SBC5 Curve Editor Runtime
        unique_id: sbc5_curve_editor_runtime
        icon: mdi:target-variant
        state: >-
          {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
          {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
          {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
          {% set fan_raw = states('sensor.sbc5_fan_level') %}
          {% set cpu_raw = states('sensor.sbc5_cpu_temperature') %}
          {% if curves | count < idx or cpu_raw in ['unknown','unavailable','none','None',''] %}
            unavailable
          {% elif active == 'custom' ~ idx and fan_raw not in ['unknown','unavailable','none','None',''] %}
            active
          {% else %}
            predicted
          {% endif %}
        attributes:
          selected_curve_index: >-
            {{ states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) }}
          selected_curve_name: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {{ curves[idx-1].get('name','Profil ' ~ idx) if curves | count >= idx else '—' }}
          active_profile_code: "{{ state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) }}"
          is_active_curve: >-
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {{ (state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true)) == 'custom' ~ idx }}
          cpu_temperature_c: >-
            {% set v = states('sensor.sbc5_cpu_temperature') %}
            {{ v | float | round(2) if v not in ['unknown','unavailable','none','None',''] else none }}
          actual_pwm_percent: >-
            {% set v = states('sensor.sbc5_fan_percent') %}
            {{ v | float | round(1) if v not in ['unknown','unavailable','none','None',''] else none }}
          actual_fan_level: >-
            {% set v = states('sensor.sbc5_fan_level') %}
            {{ v | int if v not in ['unknown','unavailable','none','None',''] else none }}
          working_source: >-
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
            {% set fan = states('sensor.sbc5_fan_level') %}
            {{ 'actual_cooling_device' if active == 'custom' ~ idx and fan not in ['unknown','unavailable','none','None',''] else 'temperature_preview' }}
          working_point_index: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
            {% set fan = states('sensor.sbc5_fan_level') %}
            {% set cpu = states('sensor.sbc5_cpu_temperature') %}
            {% set ns = namespace(level=0) %}
            {% if active == 'custom' ~ idx and fan not in ['unknown','unavailable','none','None',''] %}
              {% set n = fan | int(0) %}
              {% set ns.level = 0 if n < 0 else (pts | count if n > pts | count else n) %}
            {% elif cpu not in ['unknown','unavailable','none','None',''] %}
              {% set t = cpu | float %}
              {% for p in pts %}{% if t >= p.get('temp_c',999) | float %}{% set ns.level = loop.index %}{% endif %}{% endfor %}
            {% endif %}
            {{ ns.level }}
          working_threshold_temp_c: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
            {% set fan = states('sensor.sbc5_fan_level') %}
            {% set cpu = states('sensor.sbc5_cpu_temperature') %}
            {% set ns = namespace(level=0) %}
            {% if active == 'custom' ~ idx and fan not in ['unknown','unavailable','none','None',''] %}
              {% set n = fan | int(0) %}{% set ns.level = 0 if n < 0 else (pts | count if n > pts | count else n) %}
            {% elif cpu not in ['unknown','unavailable','none','None',''] %}
              {% set t = cpu | float %}{% for p in pts %}{% if t >= p.get('temp_c',999) | float %}{% set ns.level = loop.index %}{% endif %}{% endfor %}
            {% endif %}
            {{ pts[ns.level-1].get('temp_c') if ns.level > 0 and pts | count >= ns.level else none }}
          working_curve_pwm_percent: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
            {% set fan = states('sensor.sbc5_fan_level') %}
            {% set cpu = states('sensor.sbc5_cpu_temperature') %}
            {% set ns = namespace(level=0) %}
            {% if active == 'custom' ~ idx and fan not in ['unknown','unavailable','none','None',''] %}
              {% set n = fan | int(0) %}{% set ns.level = 0 if n < 0 else (pts | count if n > pts | count else n) %}
            {% elif cpu not in ['unknown','unavailable','none','None',''] %}
              {% set t = cpu | float %}{% for p in pts %}{% if t >= p.get('temp_c',999) | float %}{% set ns.level = loop.index %}{% endif %}{% endfor %}
            {% endif %}
            {{ pts[ns.level-1].get('pwm_percent') if ns.level > 0 and pts | count >= ns.level else 0 }}
          working_display_temp_c: >-
            {% set v = states('sensor.sbc5_cpu_temperature') %}
            {{ v | float | round(2) if v not in ['unknown','unavailable','none','None',''] else none }}
          working_display_pwm_percent: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {% set active = state_attr('sensor.sbc5_active_fan_profile','profile_code') | default('', true) %}
            {% set fan = states('sensor.sbc5_fan_level') %}
            {% set pwm = states('sensor.sbc5_fan_percent') %}
            {% set cpu = states('sensor.sbc5_cpu_temperature') %}
            {% set ns = namespace(level=0) %}
            {% if active == 'custom' ~ idx and fan not in ['unknown','unavailable','none','None',''] and pwm not in ['unknown','unavailable','none','None',''] %}
              {{ pwm | float | round(1) }}
            {% elif cpu not in ['unknown','unavailable','none','None',''] %}
              {% set t = cpu | float %}{% for p in pts %}{% if t >= p.get('temp_c',999) | float %}{% set ns.level = loop.index %}{% endif %}{% endfor %}
              {{ pts[ns.level-1].get('pwm_percent') if ns.level > 0 and pts | count >= ns.level else 0 }}
            {% else %}
              {{ none }}
            {% endif %}
          setpoint_c: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {{ curves[idx-1].get('target_temp_c') if curves | count >= idx else none }}
          setpoint_pwm_percent: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set c = curves[idx-1] if curves | count >= idx else dict() %}
            {% set pts = c.get('points',[]) %}
            {% set target = c.get('target_temp_c', none) %}
            {% set ns = namespace(v=none) %}
            {% if target is not none and pts | count > 0 %}
              {% set tx = target | float %}
              {% if tx <= pts[0].get('temp_c',0) | float %}{% set ns.v = pts[0].get('pwm_percent',0) | float %}
              {% elif tx >= pts[-1].get('temp_c',0) | float %}{% set ns.v = pts[-1].get('pwm_percent',0) | float %}
              {% else %}
                {% for p in pts %}
                  {% if not loop.last %}
                    {% set q = pts[loop.index] %}
                    {% set x0 = p.get('temp_c',0) | float %}{% set x1 = q.get('temp_c',0) | float %}
                    {% if tx >= x0 and tx <= x1 and x1 > x0 %}
                      {% set y0 = p.get('pwm_percent',0) | float %}{% set y1 = q.get('pwm_percent',0) | float %}
                      {% set ns.v = y0 + (tx-x0) * (y1-y0) / (x1-x0) %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endif %}
            {{ ns.v | round(1) if ns.v is not none else none }}
          dense_from_c: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {{ pts[4].get('temp_c') if pts | count >= 11 else none }}
          dense_to_c: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {{ pts[10].get('temp_c') if pts | count >= 11 else none }}
          selected_point_index: >-
            {{ states('input_select.sbc5_curve_editor_point').split()[-1] | int(1) }}
          selected_point_temp_c: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pi = states('input_select.sbc5_curve_editor_point').split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {{ pts[pi-1].get('temp_c') if pts | count >= pi else none }}
          selected_point_pwm_percent: >-
            {% set curves = state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] %}
            {% set idx = states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) %}
            {% set pi = states('input_select.sbc5_curve_editor_point').split()[-1] | int(1) %}
            {% set pts = curves[idx-1].get('points',[]) if curves | count >= idx else [] %}
            {{ pts[pi-1].get('pwm_percent') if pts | count >= pi else none }}
          refresh_key: >-
            {{ states('input_select.sbc5_curve_editor_curve') }}|{{ states('input_select.sbc5_curve_editor_point') }}|{{ states('sensor.sbc5_cpu_temperature') }}|{{ states('sensor.sbc5_fan_level') }}|{{ states('sensor.sbc5_fan_percent') }}|{{ state_attr('sensor.sbc5_control_center_curve_editor','last_update') }}

  # Low-rate Recorder history: these values are diagnostic trends, not control-loop inputs.
  # Updating them every 30 s keeps More Info/history useful while reducing template renders and DB writes.
  - triggers:
      - trigger: time_pattern
        seconds: "/30"
    sensor:
      - name: SBC5 AI Bucket Maturity
        unique_id: sbc5_ai_bucket_maturity
        icon: mdi:progress-check
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('qualified_samples_total') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {% set bucket = ai.get('bucket', 'low') %}
          {% set bp_raw = ai.get('bucket_progress', {}) %}
          {% set bp = bp_raw if bp_raw is mapping else {} %}
          {% set b = bp.get(bucket, {}) %}
          {% set b = b if b is mapping else {} %}
          {% set q = b.get('qualified', ai.get('qualified_samples_total', 0)) | float(0) %}
          {% set req = ai.get('min_samples', 30) | float(30) %}
          {{ ([100, (q / req * 100 if req > 0 else 0)] | min) | round(1) }}

      - name: SBC5 AI Observations
        unique_id: sbc5_ai_observations
        icon: mdi:database-eye-outline
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('observations_total') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {{ ai.get('observations_total', 0) | int(0) }}

      - name: SBC5 AI Qualified Samples
        unique_id: sbc5_ai_qualified_samples
        icon: mdi:database-check-outline
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('qualified_samples_total') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {{ ai.get('qualified_samples_total', 0) | int(0) }}

      - name: SBC5 AI Model Coverage
        unique_id: sbc5_ai_model_coverage
        icon: mdi:chart-donut-variant
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('model_coverage_percent') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {{ ai.get('model_coverage_percent', 0) | float(0) | round(1) }}

      - name: SBC5 AI Workload
        unique_id: sbc5_ai_workload
        icon: mdi:cpu-64-bit
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and (ai.get('cpu_load_smoothed_percent') is not none or ai.get('cpu_load_percent') is not none) }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {{ ai.get('cpu_load_smoothed_percent', ai.get('cpu_load_percent', 0)) | float(0) | round(1) }}

      - name: SBC5 AI Stable Seconds
        unique_id: sbc5_ai_stable_seconds
        icon: mdi:timer-check-outline
        unit_of_measurement: "s"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping and ai.get('stable_seconds') is not none }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {{ ai.get('stable_seconds', 0) | float(0) | round(1) }}

      - name: SBC5 AI Grid Coverage
        unique_id: sbc5_ai_grid_coverage
        icon: mdi:grid
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') %}
          {{ ai is mapping }}
        state: >-
          {% set ai = state_attr('sensor.sbc5_control_center_ai_runtime', 'ai_cooling') or {} %}
          {% set gs = ai.get('grid_suggestion', {}) if ai is mapping else {} %}
          {{ gs.get('model_coverage_percent', ai.get('model_coverage_percent', 0)) | float(0) | round(1) }}



# 1.7.2 — telemetria sprzętowa pochodzi z uprzywilejowanej aplikacji hostowej.
# Uprzywilejowana aplikacja odczytuje prawdziwy hostowy sysfs i przekazuje szybkie snapshoty
# do Home Assistant; sterowanie i telemetria pracują w rozdzielonych cyklach 5/10 s. Dzięki temu RAW PWM
# 130 pozostaje 130 (≈51%), zamiast błędnego 255/100% z namespace Core.

# Encje sensor/binary_sensor są tworzone przez natywną integrację; aktualizację aplikacji pokazuje Supervisor
# /config/custom_components/sbc5_control_center.

script:
  sbc5_single_stable_curve_focus:
    alias: "SBC5 - przygotuj pojedynczą krzywą stabilną"
    icon: mdi:target-variant
    mode: restart
    sequence:
      - variables:
          first_curve_option: >-
            {% set opts = state_attr('input_select.sbc5_curve_editor_curve','options') or [] %}
            {{ opts[0] if opts | count > 0 else 'Własna 1 — Zbalansowana · 50°C' }}
      - action: input_select.select_option
        target:
          entity_id: input_select.sbc5_curve_editor_curve
        data:
          option: "{{ first_curve_option }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sbc5_curve_editor_expert_mode
      - action: script.sbc5_curve_editor_load_curve

  sbc5_single_stable_curve_save:
    alias: "SBC5 - generuj jedną stabilną charakterystykę"
    icon: mdi:chart-bell-curve-cumulative
    mode: restart
    sequence:
      - action: script.sbc5_single_stable_curve_focus
      - action: input_text.set_value
        target:
          entity_id: input_text.sbc5_curve_editor_name
        data:
          value: "Stabilna"
      - action: input_select.select_option
        target:
          entity_id: input_select.sbc5_curve_editor_response_mode
        data:
          option: "Precyzyjna"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_hyst_dense_c
        data:
          value: 0.75
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_hyst_outer_c
        data:
          value: 1.0
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_min_pwm
        data:
          value: 29
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_target_pwm
        data:
          value: 55
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_max_pwm
        data:
          value: 100
      - action: script.sbc5_curve_editor_save_template

  sbc5_single_stable_curve_select_profile:
    alias: "SBC5 - wybierz pojedynczy profil własny"
    icon: mdi:fan-auto
    mode: restart
    sequence:
      - variables:
          options: "{{ state_attr('input_select.sbc5_fan_profile','options') or [] }}"
          own_profile: >-
            {% set ns = namespace(value='') %}
            {% for item in options %}
              {% if ns.value == '' and item.startswith('Własna 1 —') %}
                {% set ns.value = item %}
              {% endif %}
            {% endfor %}
            {{ ns.value }}
      - condition: template
        value_template: "{{ own_profile | length > 0 }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.sbc5_fan_profile
        data:
          option: "{{ own_profile }}"

  sbc5_single_stable_curve_apply:
    alias: "SBC5 - wygeneruj i zastosuj pojedynczą krzywą"
    icon: mdi:fan-check
    mode: restart
    sequence:
      - action: script.sbc5_single_stable_curve_save
      - action: script.sbc5_curve_editor_apply_selected

  sbc5_single_stable_curve_apply_and_reboot:
    alias: "SBC5 - wygeneruj krzywą i uruchom host ponownie"
    icon: mdi:restart-alert
    mode: single
    sequence:
      - action: script.sbc5_single_stable_curve_save
      - action: script.sbc5_curve_editor_apply_selected
      - delay: "00:00:05"
      - action: hassio.host_reboot

  sbc5_single_stable_curve_reset_50:
    alias: "SBC5 - przywróć stabilną krzywą 50°C"
    icon: mdi:restore
    mode: restart
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_target_c
        data:
          value: 50
      - action: script.sbc5_single_stable_curve_save

  sbc5_curve_editor_refresh:
    alias: "SBC5 Curve Editor - odśwież dane"
    icon: mdi:refresh
    mode: restart
    sequence:
      - action: hassio.app_stdin
        data:
          app: >-
            {% set canonical = state_attr('sensor.sbc5_control_center_update','runtime_app_slug') | default('', true) %}
            {% set legacy = state_attr('sensor.rpi5_fan_manager_update','runtime_app_slug') | default('', true) %}
            {% set slug = canonical if (canonical in ['local_sbc5_control_center','local_rpi5_fan_manager'] or canonical.endswith('_sbc5_control_center') or canonical.endswith('_rpi5_fan_manager')) else legacy %}
            {{ slug if (slug in ['local_sbc5_control_center','local_rpi5_fan_manager'] or slug.endswith('_sbc5_control_center') or slug.endswith('_rpi5_fan_manager')) else 'local_rpi5_fan_manager' }}
          input:
            command: curve_editor_refresh
      - delay: "00:00:01"
      - action: script.sbc5_curve_editor_load_curve

  sbc5_curve_editor_load_curve:
    alias: "SBC5 Curve Editor - wczytaj wybraną krzywą"
    icon: mdi:database-import-outline
    mode: restart
    sequence:
      - variables:
          curve_idx: >-
            {{ states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) }}
          curves: "{{ state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] }}"
      - condition: template
        value_template: "{{ curves | count >= curve_idx }}"
      - variables:
          c: "{{ curves[curve_idx - 1] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.sbc5_curve_editor_name
        data:
          value: "{{ c.get('name', 'Profil ' ~ curve_idx) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_target_c
        data:
          value: "{{ c.get('target_temp_c', 50) | float(50) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_hyst_dense_c
        data:
          value: "{{ c.get('hysteresis_dense_c', 0.75) | float(0.75) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_hyst_outer_c
        data:
          value: "{{ c.get('hysteresis_outer_c', 1.0) | float(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_min_pwm
        data:
          value: "{{ c.get('min_pwm_percent', 29) | float(29) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_target_pwm
        data:
          value: "{{ c.get('target_pwm_percent', 55) | float(55) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_max_pwm
        data:
          value: "{{ c.get('max_pwm_percent', 100) | float(100) }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.sbc5_curve_editor_response_mode
        data:
          option: >-
            {% set m = c.get('response_mode', 'precise') %}
            {% if m == 'gentle' %}Łagodna{% elif m == 'balanced' %}Zbalansowana{% else %}Precyzyjna{% endif %}
      - action: script.sbc5_curve_editor_load_point

  sbc5_curve_editor_load_point:
    alias: "SBC5 Curve Editor - wczytaj wybrany punkt"
    icon: mdi:vector-point-select
    mode: restart
    sequence:
      - variables:
          curve_idx: >-
            {{ states('input_select.sbc5_curve_editor_curve').split('—')[0].split()[-1] | int(1) }}
          point_idx: >-
            {{ states('input_select.sbc5_curve_editor_point').split()[-1] | int(1) }}
          curves: "{{ state_attr('sensor.sbc5_control_center_curve_editor','curves') or [] }}"
      - condition: template
        value_template: >-
          {{ curves | count >= curve_idx and
             curves[curve_idx - 1].get('points', []) | count >= point_idx }}
      - variables:
          p: "{{ curves[curve_idx - 1].get('points', [])[point_idx - 1] }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_point_temp_c
        data:
          value: "{{ p.get('temp_c', 44) | float(44) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sbc5_curve_editor_point_hyst_c
