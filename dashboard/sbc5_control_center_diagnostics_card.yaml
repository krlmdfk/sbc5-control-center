  # ============================================================
  # WYKRES — temperatura CPU + PWM
  # ============================================================
  - type: custom:apexcharts-card
    graph_span: 1h
    update_interval: 30s
    header:
      show: true
      title: Temperatura CPU i PWM · ostatnia godzina
      show_states: true
      colorize_states: true
    span:
      end: minute

    yaxis:
      - id: temp
        min: 35
        max: 80
        decimals: 0
        apex_config:
          tickAmount: 5
          title:
            text: °C

      - id: pwm
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 5
          title:
            text: "%"

    series:
      - entity: sensor.sbc5_cpu_temperature
        name: Temperatura
        yaxis_id: temp
        type: line
        color: "#ff9800"
        stroke_width: 3
        curve: smooth
        float_precision: 1
        show:
          in_header: raw
        group_by:
          func: avg
          duration: 1min

      - entity: sensor.sbc5_fan_percent
        name: PWM
        yaxis_id: pwm
        type: line
        color: "#03a9f4"
        stroke_width: 2
        curve: smooth
        float_precision: 0
        show:
          in_header: raw
        group_by:
          func: avg
          duration: 1min

    apex_config:
      chart:
        height: 230
        toolbar:
          show: false
        zoom:
          enabled: false

      legend:
        show: true
        position: top
        horizontalAlign: right
        fontSize: 11px

      stroke:
        curve: smooth

      grid:
        show: true
        borderColor: rgba(120,150,170,.18)
        strokeDashArray: 3
        padding:
          left: 2
          right: 2
          top: 0
          bottom: 0

      xaxis:
        type: datetime
        tickAmount: 4
        labels:
          show: true
          datetimeUTC: false
          format: HH:mm
          style:
            fontSize: 10px
        axisBorder:
          show: false
        axisTicks:
          show: false

      tooltip:
        enabled: true
        shared: true
        x:
          format: HH:mm

    card_mod:
      style: |
        ha-card {
          min-height: 260px;
          border-radius: 16px;
          border: 1px solid rgba(0,188,255,.15);
          background: linear-gradient(145deg, rgba(18,27,34,.98), rgba(10,16,21,.98));
          box-shadow: none;
          overflow: hidden;
        }
        /* SBC5CC 3.1.3 chart screen-fit */
        ha-card {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
          overflow: hidden !important;
        }

  # ============================================================
  # CPU / OC — profil + rozwijany zegar czterech rdzeni
  # ============================================================
  - type: markdown
    content: |
      ## CPU / Overclocking
    card_mod:
      style: |
        ha-card { background: transparent; box-shadow: none; padding: 8px 6px 0 6px; margin: 0; }
        ha-markdown { padding: 0 !important; }
        h2 { margin: 0 !important; font-size: 20px !important; line-height: 1.05 !important; }

  - type: custom:mushroom-template-card
    multiline_secondary: true
    entity: sensor.sbc5_cpu_oc_profile
    primary: >-
      {{ states('sensor.sbc5_cpu_oc_profile') }}
    secondary: >-
      {% set saved = state_attr('sensor.sbc5_overclock_status','saved_arm_freq_mhz') | int(0) %}
      {% set runtime = state_attr('sensor.sbc5_overclock_status','runtime_max_mhz') | int(0) %}
      {% set pending = is_state('sensor.sbc5_restart_required','host') or is_state('binary_sensor.sbc5_config_pending_restart','on') %}
      zapis {{ saved if saved > 0 else 'Auto' }} MHz · runtime max {{ runtime if runtime > 0 else '—' }} MHz
