              ha-card {
                min-height: 72px;
                padding-top: 7px !important;
                padding-bottom: 7px !important;
              }
            }
            /* SBC5CC 3.1.3 screen-fit guard */
            ha-card {
              width: 100% !important;
              max-width: 100% !important;
              min-width: 0 !important;
              box-sizing: border-box !important;
