  # ============================================================
  # RECOVERY — jawne potwierdzenie Tak / Nie
  # ============================================================
  - type: conditional
    conditions:
      - entity: input_boolean.sbc5_confirm_restore_active_cooler
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            ### Przywrócić fabryczne ustawienia Active Cooler?
            **Czy jesteś pewien?** Zostanie przywrócona fabryczna charakterystyka chłodzenia Raspberry Pi 5. Własna krzywa i kalibracja pozostaną zapisane. Zmiana wymaga pełnego restartu RPi5.
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: template
              icon: mdi:check-circle
              icon_color: green
              content: Tak — potwierdzam
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target: {entity_id: script.sbc5_fan_restore_factory}
            - type: template
              icon: mdi:close-circle
              icon_color: red
              content: Nie — anuluj
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target: {entity_id: script.sbc5_cancel_restore_active_cooler}

  - type: conditional
    conditions:
      - entity: input_boolean.sbc5_confirm_restore_system_defaults
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: |
            ### Cofnąć zmiany RPi5 wprowadzone przez Control Center?
            **Czy potwierdzasz?** Aplikacja usunie wyłącznie własne bloki CPU/OC/USB i Config Manager z `config.txt`. Ręczne wpisy użytkownika poza blokami Control Center pozostaną bez zmian. Przed operacją powstanie backup, a automatyczna synchronizacja `config.txt` zostanie zablokowana do świadomego ponownego włączenia.
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: template
              icon: mdi:check-circle
              icon_color: green
              content: Tak — potwierdzam
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target: {entity_id: script.sbc5_restore_system_defaults_confirmed}
            - type: template
              icon: mdi:close-circle
              icon_color: red
              content: Nie — anuluj
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target: {entity_id: script.sbc5_cancel_restore_system_defaults}


