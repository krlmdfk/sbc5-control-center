                    }
                  }
                  /* SBC5CC 3.1.3 screen-fit guard */
                  ha-card {
                    width: 100% !important;
                    max-width: 100% !important;
                    min-width: 0 !important;
                    box-sizing: border-box !important;
                  }
                  mushroom-state-info {
                    min-width: 0 !important;
                    width: 100% !important;
                  }
                  .primary, .secondary {
                    white-space: normal !important;
                    overflow: visible !important;
                    text-overflow: clip !important;
                    max-width: 100% !important;
                    overflow-wrap: anywhere !important;
                    word-break: normal !important;
                  }
                  /* SBC5CC 3.1.3 equal-height responsive tile */
                  ha-card {
                    height: 100% !important;
                          }
                  .primary {
                    font-size: clamp(12px, 3.25vw, 14px) !important;
                    line-height: 1.16 !important;
                  }
                  .secondary {
                    font-size: clamp(10px, 2.75vw, 12px) !important;
                    line-height: 1.20 !important;
                  }


          card_mod:
            style: |
              /* SBC5CC 3.1.3 responsive grid */
              #root {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
                gap: clamp(6px, 1.8vw, 10px) !important;
                align-items: stretch !important;
              }
              #root > * {
                min-width: 0 !important;
                height: 100% !important;
              }
              @media (max-width: 339px) {
                #root { grid-template-columns: 1fr !important; }
              }
              @media (min-width: 720px) {
                #root { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)) !important; }
              }
