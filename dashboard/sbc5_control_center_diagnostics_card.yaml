# SBC5 Control Center — Diagnostics Dashboard · Card UI v3.1.3
# Duży wykres 230 px: temperatura CPU + PWM oraz pełne informacje diagnostyczne na dole.
# Bez zbędnego dublowania danych.
# Wymagane: Mushroom, card-mod, ApexCharts Card, Browser Mod.
# Wklej: Dashboard -> Dodaj kartę -> Ręcznie.
#
type: vertical-stack
cards:

  # ============================================================
  # HERO — stan ogólny + profil + wersja, bez powielania metryk
  # ============================================================
  - type: custom:mushroom-template-card
    multiline_secondary: true
    entity: sensor.sbc5_cpu_temperature
    primary: Raspberry Pi 5
    secondary: >-
      {% set problem = is_state('binary_sensor.sbc5_cooling_problem','on')
         or is_state('binary_sensor.sbc5_high_temperature','on') %}
      {% if problem %}
        Wymaga uwagi
      {% else %}
        System działa prawidłowo
      {% endif %}
      {% set desired_s = states('sensor.sbc5_requested_fan_profile') %}
      {% set desired_l = states('sensor.rpi5_requested_fan_profile') %}
      {% set desired = desired_s if desired_s not in ['unknown','unavailable',''] else desired_l %}
      {% set runtime_s = states('sensor.sbc5_active_fan_profile') %}
      {% set runtime_l = states('sensor.rpi5_active_fan_profile') %}
      {% set runtime = runtime_s if runtime_s not in ['unknown','unavailable',''] else runtime_l %}
      {% set activation_s = states('sensor.sbc5_fan_profile_activation') %}
      {% set activation_l = states('sensor.rpi5_fan_profile_activation') %}
      {% set activation = activation_s if activation_s not in ['unknown','unavailable',''] else activation_l %}
      · żądany {{ desired if desired not in ['unknown','unavailable',''] else states('input_select.sbc5_fan_profile') }}
      · runtime {{ runtime }}
      {% if activation == 'pending_host_reboot' %}· restart hosta wymagany{% endif %}
      {% set cm = state_attr('sensor.sbc5_active_fan_profile','control_mode_label') | default(state_attr('sensor.rpi5_active_fan_profile','control_mode_label'), true) %}
      {% if cm %}· {{ cm }}{% endif %}
      · v{{ state_attr('sensor.sbc5_control_center_update','installed_version')
            | default(states('sensor.sbc5_package_version'), true) }}
      · Card UI v3.1.3
    icon: mdi:raspberry-pi
    icon_color: >-
      {% if is_state('binary_sensor.sbc5_cooling_problem','on')
         or is_state('binary_sensor.sbc5_high_temperature','on') %}
        red
      {% else %}
        green
      {% endif %}
    layout: horizontal
    tap_action:
      action: more-info
    card_mod:
      style: |
        ha-card {
          min-height: 74px;
          border-radius: 19px;
          border: 1px solid rgba(0,188,255,.32);
          background:
            radial-gradient(circle at 92% 0%, rgba(0,188,255,.16), transparent 42%),
            linear-gradient(145deg, rgba(19,34,44,.98), rgba(11,18,24,.98));
          box-shadow: none;
          padding: 3px 9px !important;
        }
        mushroom-shape-icon {
          --icon-size: 46px;
          --shape-color: rgba(0,188,255,.10) !important;
        }
        .primary {
          font-size: 16px !important;
          font-weight: 700 !important;
        }
        .secondary {
          font-size: 11.5px !important;
          line-height: 1.18 !important;
        }
        /* SBC5CC 3.1.3 screen-fit guard */
        ha-card {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
        }
        mushroom-state-info {
          min-width: 0 !important;
          width: 100% !important;
        }
        .primary, .secondary {
          white-space: normal !important;
          overflow: visible !important;
          text-overflow: clip !important;
          max-width: 100% !important;
          overflow-wrap: anywhere !important;
          word-break: normal !important;
        }

