        - type: conditional
          conditions:
            - entity: sensor.sbc5_control_center_update
              state: "available"
            - entity: binary_sensor.sbc5_local_package_update_available
              state: "on"
          card:
            type: custom:mushroom-template-card
            multiline_secondary: true
            primary: >-
              Zainstaluj build {{ state_attr('sensor.sbc5_control_center_update','latest_version') | default('aktualizację', true) }}
            secondary: >-
              App + Card UI mają jeden wspólny numer wydania · {{ state_attr('sensor.sbc5_control_center_update','local_package_file') | default('zweryfikowana lokalna paczka ZIP', true) }}
            icon: mdi:package-down
            icon_color: cyan
