                     | default(states('sensor.sbc5_package_version'), true) %}
                Build v{{ app }} · App + Card UI zsynchronizowane
              icon: mdi:package-variant-closed-check
              icon_color: green
              layout: horizontal
              tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    min-height: 66px;
                    height: auto !important;
                    border-radius: 15px;
                    border: 1px solid rgba(125,190,220,.14);
                    background: linear-gradient(145deg, rgba(26,33,40,.96), rgba(16,22,28,.96));
                    box-shadow: none;
                    padding: 2px 6px !important;
                  }
                  mushroom-shape-icon { --icon-size: 36px; }
                  mushroom-state-info { min-width: 0 !important; }
                  .primary, .secondary {
                    white-space: normal !important;
                    overflow: visible !important;
                    text-overflow: clip !important;
                    max-width: 100% !important;
                    overflow-wrap: anywhere !important;
                  }
                  .primary { font-size: 12.5px !important; font-weight: 700 !important; line-height: 1.15 !important; }
                  .secondary { font-size: 10.5px !important; line-height: 1.18 !important; }
                  @media (max-width: 600px) {
                    ha-card {
                      min-height: 74px;
                      padding-top: 7px !important;
                      padding-bottom: 7px !important;
                    }
                  }
                  /* SBC5CC 3.1.11 screen-fit guard */
                  ha-card {
                    width: 100% !important;
                    max-width: 100% !important;
                    min-width: 0 !important;
                    box-sizing: border-box !important;
                  }
                  mushroom-state-info {
                    min-width: 0 !important;
                    width: 100% !important;
                  }
                  .primary, .secondary {
                    white-space: normal !important;
                    overflow: visible !important;
                    text-overflow: clip !important;
                    max-width: 100% !important;
                    overflow-wrap: anywhere !important;
                    word-break: normal !important;
                  }
                  /* SBC5CC 3.1.11 equal-height responsive tile */
