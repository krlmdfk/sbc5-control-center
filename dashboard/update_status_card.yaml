# SBC5 Control Center 3.1.11 — Update Status Card
# Mobile-first card aligned with the main SBC5 Control Center visual language.
# Requires: Mushroom + card-mod.
# Paste: Dashboard -> Add card -> Manual.

type: vertical-stack
cards:

  # ============================================================
  # HERO — one glance: current / update / attention
  # ============================================================
  - type: custom:mushroom-template-card
    multiline_secondary: true
    primary: SBC5 Control Center
    secondary: >-
      {% set s = states('sensor.sbc5_control_center_update') %} {% set installed = state_attr('sensor.sbc5_control_center_update','installed_version')
           | default(states('sensor.sbc5_package_version'), true) %}
      {% set latest = state_attr('sensor.sbc5_control_center_update','latest_version')
           | default(installed, true) %}
      {% if s == 'available' %}
        Aktualizacja buildu · {{ installed }} → {{ latest }}
      {% elif s == 'current' %}
        Wersja {{ installed }} jest aktualna
      {% elif s in ['unknown','unavailable','none',''] %}
        Wersja {{ installed }} · oczekiwanie na synchronizację statusu
      {% elif s == 'disabled' %}
        Automatyczne sprawdzanie jest wyłączone
      {% else %}
        {{ state_attr('sensor.sbc5_control_center_update','status_message')
           | default('Sprawdź status aktualizacji', true) }}
      {% endif %}

      {% if is_state('input_boolean.sbc5_update_controls_visible','on') %}· opcje ▲{% else %}· dotknij, aby rozwinąć ▼{% endif %}
    icon: >-
      {% set s = states('sensor.sbc5_control_center_update') %}
      {% if s == 'available' %}mdi:download-circle
      {% elif s == 'current' %}mdi:check-decagram
      {% elif s in ['unknown','unavailable','none',''] %}mdi:cloud-question
      {% else %}mdi:update{% endif %}
    icon_color: >-
      {% set s = states('sensor.sbc5_control_center_update') %}
      {% if s == 'available' %}cyan
      {% elif s == 'current' %}green
      {% elif s in ['unknown','unavailable','none',''] %}orange
      {% else %}blue{% endif %}
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: input_boolean.toggle
      target:
        entity_id: input_boolean.sbc5_update_controls_visible
    card_mod:
      style: |
        /* Update Card v3.1.11 */
        ha-card {
          min-height: 78px;
          border-radius: 19px;
          border: 1px solid rgba(0,188,255,.32);
          background:
            radial-gradient(circle at 92% 0%, rgba(0,188,255,.16), transparent 42%),
            linear-gradient(145deg, rgba(19,34,44,.98), rgba(11,18,24,.98));
          box-shadow: none;
          padding: 3px 9px !important;
        }
        mushroom-shape-icon {
          --icon-size: 46px;
          --shape-color: rgba(0,188,255,.10) !important;
        }
        mushroom-state-info { min-width: 0 !important; }
        .primary, .secondary { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; max-width: 100% !important; overflow-wrap: anywhere !important; }
        .primary { font-size: 16px !important; font-weight: 700 !important; }
        .secondary { font-size: 11.5px !important; line-height: 1.18 !important; }
        /* SBC5CC 3.1.11 screen-fit guard */
        ha-card {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          box-sizing: border-box !important;
        }
        mushroom-state-info {
          min-width: 0 !important;
          width: 100% !important;
        }
        .primary, .secondary {
          white-space: normal !important;
          overflow: visible !important;
          text-overflow: clip !important;
          max-width: 100% !important;
          overflow-wrap: anywhere !important;
          word-break: normal !important;
        }

  # ============================================================
  # STATUS — compact two-column overview
  # ============================================================
    entity: sensor.sbc5_control_center_update
    hold_action:
      action: more-info
  - type: conditional
    conditions:
      - entity: input_boolean.sbc5_update_controls_visible
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:mushroom-template-card
              multiline_secondary: true
              primary: Zainstalowana
              secondary: >-
