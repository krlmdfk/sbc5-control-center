version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/local_apps/sbc5_control_center"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "/local_apps/sbc5_control_center/rust-core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
