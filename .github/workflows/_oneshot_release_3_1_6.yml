name: One-shot 3.1.6 release preparation

on:
  push:
    paths:
      - 'scripts/_oneshot_release_3_1_6.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3.1.6-predictor-accuracy-calibration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare 3.1.6
        run: python scripts/_oneshot_release_3_1_6.py
      - name: Validate predictor and release
        run: |
          python scripts/test_thermal_predictor_accuracy.py
          python scripts/test_thermal_predictor_shadow.py
          python scripts/validate_release.py --strict-manifest-hashes
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare SBC5 Control Center 3.1.6'
          git push origin HEAD:feature/3.1.6-predictor-accuracy-calibration
