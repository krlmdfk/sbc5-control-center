name: Prepare SBC5 2.8.34

on:
  push:
    branches:
      - maintenance/2.8.34-store-canary-auto
    paths:
      - .github/workflows/prepare-2.8.34.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare unified bilingual release
        run: >-
          python scripts/release_prepare.py
          --version 2.8.34
          --release-date 2026-10-26
          --restart-required none
          --summary-en "Migration-routing hotfix: a completed legacy handoff no longer blocks exporting preserved stable state to a newer stopped Rust canary."
          --summary-pl "Hotfix routingu migracji: zakończony starszy handoff nie blokuje już eksportu zachowanego stanu stabilnej aplikacji do nowszej zatrzymanej canary Rust."
          --fixed-en "Treat an already imported legacy handoff addressed to the current Store identity as historical when a newer stopped canary is available."
          --fixed-en "Preserve the legacy backup and audit trail while allowing a fresh schema 2 canary handoff to be created."
          --fixed-pl "Traktuj już zaimportowany starszy handoff skierowany do bieżącej instancji Store jako historyczny, gdy dostępna jest nowsza zatrzymana canary."
          --fixed-pl "Zachowaj starszy backup i ślad audytowy, jednocześnie umożliwiając utworzenie świeżego handoffu schema 2 do canary."
          --security-en "No fan-control, Adaptive PWM, AI Cooling, CPU/GPU profile or boot-control algorithm changes."
          --security-pl "Brak zmian algorytmów sterowania wentylatorem, Adaptive PWM, AI Cooling, profili CPU/GPU i konfiguracji boot."
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release preparation changes to commit"
            exit 0
          fi
          git commit -m "Prepare SBC5 Control Center 2.8.34"
          git push origin HEAD:maintenance/2.8.34-store-canary-auto
