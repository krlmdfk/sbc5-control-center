name: Prepare 3.1.15 card diagnostics

on:
  push:
    branches:
      - release/3.1.15-card-ai-diagnostics

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Patch Card UI diagnostics and prepare release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.')
          release = json.loads((root / 'local_apps/sbc5_control_center/release.json').read_text(encoding='utf-8'))
          card_path = root / 'dashboard/sbc5_control_center_diagnostics_card.yaml'
          test_path = root / 'scripts/test_ai_v5_observability.py'
          card = card_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          marker = 'sparse_direct_ui_guard_v315'
          if release.get('version') == '3.1.15' and marker in test:
              print('3.1.15 card fix already prepared; nothing to do')
              raise SystemExit(0)

          old_conf = "{% set direct = ai.direct_confidence_percent | default(ai.confidence_percent | default(0, true), true) %}"
          new_conf = "{% set direct = ai.direct_confidence_percent if ai.direct_confidence_percent is defined else '—' %}"
          if old_conf not in card:
              raise SystemExit('direct confidence fallback not found')
          card = card.replace(old_conf, new_conf)

          old_effective = "{% set effective = ai.effective_confidence_percent | default(ai.confidence_percent | default(0, true), true) %}"
          new_effective = "{% set effective = ai.effective_confidence_percent if ai.effective_confidence_percent is defined else (ai.confidence_percent if ai.confidence_percent is defined else '—') %}"
          if old_effective not in card:
              raise SystemExit('effective confidence fallback not found')
          card = card.replace(old_effective, new_effective)

          old_pred = "direct {{ ai.direct_prediction_pwm_percent | default(ai.prediction_pwm_percent | default('—', true), true) }}%"
          new_pred = "direct {{ ai.direct_prediction_pwm_percent if ai.direct_prediction_pwm_percent is defined and ai.direct_prediction_pwm_percent is not none and (ai.direct_prediction_pwm_percent | float(-1)) >= 0 else '—' }}%"
          if old_pred not in card:
              raise SystemExit('direct prediction fallback not found')
          card = card.replace(old_pred, new_pred)

          old_eff_pred = "· effective {{ ai.effective_prediction_pwm_percent | default(ai.prediction_pwm_percent | default('—', true), true) }}%"
          new_eff_pred = "· effective {{ ai.effective_prediction_pwm_percent if ai.effective_prediction_pwm_percent is defined and ai.effective_prediction_pwm_percent is not none and (ai.effective_prediction_pwm_percent | float(-1)) >= 0 else (ai.prediction_pwm_percent if ai.prediction_pwm_percent is defined else '—') }}%"
          if old_eff_pred not in card:
              raise SystemExit('effective prediction fallback not found')
          card = card.replace(old_eff_pred, new_eff_pred)

          old_transfer = "· {{ ai.transfer_source | default('direct', true) }} · baza {{ ai.baseline_pwm_percent | default('—', true) }}%"
          new_transfer = "{% set transfer = ai.transfer_source | default('—') %} {% set transient = transfer.split('transient[')[1].split(']')[0] if 'transient[' in transfer else '' %} · transfer {{ transfer.split('+transient[')[0] }} {% if transient %}· transient {{ transient | replace(',', ' · ') }}{% endif %} · baza {{ ai.baseline_pwm_percent | default('—') }}%"
          if old_transfer not in card:
              raise SystemExit('transfer source line not found')
          card = card.replace(old_transfer, new_transfer)

          card_path.write_text(card, encoding='utf-8')
          parsed = yaml.safe_load(card)
          (root / 'local_apps/sbc5_control_center/dashboard_card.json').write_text(
              json.dumps(parsed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          guard = f'''\n# {marker}\nassert "ai.direct_confidence_percent | default(ai.confidence_percent" not in card_text\nassert "ai.direct_prediction_pwm_percent | default(ai.prediction_pwm_percent" not in card_text\nassert "ai.direct_confidence_percent if ai.direct_confidence_percent is defined else '—'" in card_text\nassert "transient {{ transient | replace(',', ' · ') }}" in card_text\n'''
          if marker not in test:
              test = test.replace('assert card_yaml == card_json\n', guard + 'assert card_yaml == card_json\n')
          test_path.write_text(test, encoding='utf-8')
          PY

          python scripts/test_ai_v5_observability.py
          python scripts/release_prepare.py \
            --version 3.1.15 \
            --restart-required none \
            --summary-en "Fix sparse-bucket AI diagnostics in Card UI without changing cooling control or learning." \
            --summary-pl "Naprawiono diagnostykę AI dla rzadkich bucketów w Card UI bez zmian sterowania chłodzeniem ani uczenia." \
            --fixed-en "Card UI no longer substitutes effective/general confidence for direct confidence when a bucket has zero qualified samples." \
            --fixed-pl "Card UI nie podstawia już pewności effective/ogólnej jako direct, gdy bucket ma zero próbek jakościowych." \
            --fixed-en "Direct PWM prediction now renders as an em dash when no direct model prediction exists." \
            --fixed-pl "Predykcja PWM direct jest teraz wyświetlana jako myślnik, gdy bezpośredni model nie ma predykcji." \
            --changed-en "Transient learning c/n/s diagnostics are shown on a separate readable line in the AI prediction tile." \
            --changed-pl "Diagnostyka transient learning c/n/s jest wyświetlana w osobnej czytelnej linii kafelka predykcji AI."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/sbc5_control_center_diagnostics_card.yaml local_apps/sbc5_control_center/dashboard_card.json scripts/test_ai_v5_observability.py .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "release: prepare SBC5 Control Center 3.1.15"
          git push origin HEAD:release/3.1.15-card-ai-diagnostics
