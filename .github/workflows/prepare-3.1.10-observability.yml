name: Prepare 3.1.10 AI v5 observability

on:
  push:
    branches:
      - release/3.1.10-ai-v5-observability

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.1.10-ai-v5-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Apply observability changes once
        run: |
          if grep -q 'observability_fields' local_apps/sbc5_control_center/ai_cooling_v5.py; then
            echo '3.1.10 observability source changes already applied.'
          else
            python scripts/prepare_ai_observability_3_1_10.py
          fi
      - name: Validate source changes
        run: |
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m compileall -q local_apps/sbc5_control_center scripts
          if [ -f scripts/test_ai_v5_observability.py ]; then python scripts/test_ai_v5_observability.py; fi
          python scripts/test_ai_hierarchical_v5.py
          python scripts/test_restart_manager_hacs_handoff.py
          git diff --check
      - name: Commit prepared source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/validate.yml || true
          git add local_apps/sbc5_control_center/ai_cooling_v5.py local_apps/sbc5_control_center/run_legacy.sh dashboard/sbc5_control_center_diagnostics_card.yaml local_apps/sbc5_control_center/dashboard_card.json
          [ -f scripts/test_ai_v5_observability.py ] && git add scripts/test_ai_v5_observability.py || true
          if git diff --cached --quiet; then
            echo 'No prepared source changes to commit.'
          else
            git commit -m 'feat: expose AI v5 effective confidence diagnostics'
            git push origin HEAD:release/3.1.10-ai-v5-observability
          fi
