name: Prepare SBC5 3.1.1 YAML Card

on:
  push:
    branches: ["ui/yaml-card-3.1.1"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Add Thermal Predictor card and prepare 3.1.1
        run: |
          python scripts/prepare_yaml_card_3_1_1.py
          python scripts/release_prepare.py \
            --version 3.1.1 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Add AI Thermal Predictor telemetry to the main YAML dashboard card with responsive history-ready tiles." \
            --summary-pl "Dodano telemetrię AI Thermal Predictor do głównej karty YAML w formie responsywnych kafelków z dostępem do historii." \
            --added-en "Main YAML dashboard card now shows AI Thermal Predictor forecasts for +30 s, +60 s and +120 s plus predictor confidence." \
            --added-pl "Główna karta YAML pokazuje prognozy AI Thermal Predictor +30 s, +60 s i +120 s oraz pewność predyktora." \
            --changed-en "Thermal Predictor tiles use native More Info history and remain observe-only; Adaptive PWM and AI Cooling control behavior is unchanged." \
            --changed-pl "Kafelki Thermal Predictor korzystają z natywnej historii More Info i pozostają obserwacyjne; sterowanie Adaptive PWM i AI Cooling nie zostało zmienione." \
            --fixed-en "Card UI version markers are synchronized with the unified 3.1.1 release instead of the stale 2.8.34 marker." \
            --fixed-pl "Znaczniki wersji Card UI są synchronizowane z wydaniem 3.1.1 zamiast starego oznaczenia 2.8.34." \
            --performance-en "No additional polling loop, frontend background renderer or host restart is introduced." \
            --performance-pl "Nie dodano dodatkowej pętli pollingu, procesu renderującego w tle ani wymogu restartu hosta."
      - name: Verify generated card surfaces
        run: |
          grep -q "AI Thermal Predictor 3.1.1" dashboard/sbc5_control_center_diagnostics_card.yaml
          grep -q "sensor.sbc5_ai_thermal_forecast_30s" dashboard/sbc5_control_center_diagnostics_card.yaml
          grep -q '"version": "3.1.1"' local_apps/sbc5_control_center/release.json
          python scripts/test_runtime_robustness.py
          python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit prepared build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SBC5 Control Center 3.1.1 — YAML Thermal Predictor card"
          git push origin HEAD:ui/yaml-card-3.1.1
