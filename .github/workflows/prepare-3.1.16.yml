name: Prepare 3.1.16 release

on:
  push:
    branches:
      - release/3.1.16-thermal-predictor-v3
    paths:
      - .github/workflows/prepare-3.1.16.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Add Thermal Predictor v3 modules to update allow-list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('update-manifest.json')
          d = json.loads(p.read_text())
          files = d.setdefault('files', {})
          files.setdefault('local_apps/sbc5_control_center/ai_cooling_legacy.py', '')
          files.setdefault('local_apps/sbc5_control_center/thermal_predictor_v3.py', '')
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Prepare professional bilingual release 3.1.16
        run: |
          python scripts/release_prepare.py \
            --version 3.1.16 \
            --release-date 2026-10-29 \
            --restart-required none \
            --summary-en "Introduce Thermal Predictor v3 with regime-aware dual-slope forecasting and context-safe online calibration." \
            --summary-pl "Wprowadzono Thermal Predictor v3 z predykcją zależną od reżimu pracy, dwoma trendami temperatury i bezpieczną kalibracją kontekstową." \
            --added-en "Thermal Predictor v3 with separate fast and slow temperature trends that persist across workload bucket changes." \
            --added-pl "Thermal Predictor v3 z osobnym szybkim i wolnym trendem temperatury, zachowywanym przy zmianach bucketów obciążenia." \
            --added-en "Per-bucket and per-horizon calibration for LOW, MEDIUM and HIGH operating regimes." \
            --added-pl "Kalibrację per bucket i per horyzont dla reżimów LOW, MEDIUM i HIGH." \
            --changed-en "Forecasts now account for CPU workload context, physical PWM state and recent context deltas instead of relying mainly on one temperature slope." \
            --changed-pl "Prognozy uwzględniają teraz kontekst obciążenia CPU, fizyczny PWM i ostatnie zmiany kontekstu zamiast opierać się głównie na jednym trendzie temperatury." \
            --changed-en "Quality scoring weights +30 s and +60 s forecasts more strongly while still tracking +120 s accuracy separately." \
            --changed-pl "Ocena jakości mocniej uwzględnia prognozy +30 s i +60 s, zachowując osobne monitorowanie dokładności +120 s." \
            --fixed-en "Prevented workload-bucket transitions from erasing the thermal trend history used by the predictor." \
            --fixed-pl "Zmiana bucketu obciążenia nie zeruje już historii trendu temperatury używanej przez Predictor." \
            --fixed-en "Context-shift guard prevents abrupt CPU/PWM changes from contaminating predictor bias and MAE calibration." \
            --fixed-pl "Context-shift guard zapobiega zanieczyszczaniu kalibracji bias/MAE przez nagłe zmiany obciążenia CPU lub PWM." \
            --performance-en "Thermal Predictor v3 remains observe-only and adds no new polling loop or physical PWM authority." \
            --performance-pl "Thermal Predictor v3 pozostaje w trybie observe-only, bez nowej pętli pollingu i bez wpływu na fizyczne sterowanie PWM."
      - name: Verify package contains v3 modules
        run: |
          python scripts/build_local_update.py --output /tmp/SBC5_UPDATE_3.1.16.zip
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/SBC5_UPDATE_3.1.16.zip')
          required = {
              'local_apps/sbc5_control_center/ai_cooling.py',
              'local_apps/sbc5_control_center/ai_cooling_legacy.py',
              'local_apps/sbc5_control_center/thermal_predictor_v3.py',
          }
          missing = required - set(z.namelist())
          assert not missing, f'missing from update ZIP: {sorted(missing)}'
          print('Thermal Predictor v3 package completeness: PASS')
          PY
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/prepare-3.1.16.yml
          git commit -m "release: prepare SBC5 Control Center 3.1.16"
          git push origin HEAD:release/3.1.16-thermal-predictor-v3
