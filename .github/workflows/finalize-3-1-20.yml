name: Finalize 3.1.20 feature branch

on:
  push:
    branches:
      - feature/3.1.20-ai-runtime-history-hotfix
    paths:
      - scripts/finalize_3_1_20.py
      - .github/workflows/finalize-3-1-20.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.1.20-ai-runtime-history-hotfix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Finalize release metadata and dashboard
        run: python scripts/finalize_3_1_20.py
      - name: Validate runtime wiring
        run: python scripts/test_ai_runtime_wiring_3_1_20.py
      - name: Validate release strictly
        run: python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit finalized 3.1.20 surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize SBC5 Control Center 3.1.20"
          git push origin HEAD:feature/3.1.20-ai-runtime-history-hotfix
