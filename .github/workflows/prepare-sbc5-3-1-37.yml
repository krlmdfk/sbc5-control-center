name: Prepare SBC5 3.1.37 release candidate

on:
  push:
    branches:
      - release/3.1.37-20261108
    paths:
      - .github/workflows/prepare-sbc5-3-1-37.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Generate canonical version and release metadata
        run: |
          python scripts/release_prepare.py \
            --version 3.1.37 \
            --release-date 2026-11-08 \
            --restart-required none \
            --summary-en "Reset stale Thermal Predictor guidance when the operating context changes, preserving learned calibration and fan safety policy." \
            --summary-pl "Reset nieaktualnej prognozy Thermal Predictora po zmianie warunków pracy, z zachowaniem wyuczonych danych i zabezpieczeń wentylatora." \
            --fixed-en "Reset short-term forecast smoothing and direction confirmations after setpoint, workload-regime, or mode changes and telemetry gaps." \
            --fixed-pl "Reset krótkoterminowego wygładzania prognoz oraz potwierdzeń kierunku po zmianie celu, zakresu obciążenia, trybu lub przerwie w telemetrii." \
            --changed-en "Expose guidance context reset reason and reset count; preserve Adaptive PWM authority and all predictor quality gates." \
            --changed-pl "Dodano przyczynę i licznik resetów stanu prognozy; bez zmian uprawnień Adaptive PWM i progów jakości."
      - name: Validate prepared version
        run: |
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_thermal_guidance_context_reset.py
          python -m compileall -q local_apps/sbc5_control_center scripts
      - name: Commit generated release candidate only to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'chore(release): prepare SBC5 3.1.37 metadata and verified hashes'
          git push origin HEAD:release/3.1.37-20261108
