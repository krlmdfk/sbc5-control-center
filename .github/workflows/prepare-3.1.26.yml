name: One-shot prepare SBC5 3.1.26

on:
  push:
    branches: ["fix/thermal-effectiveness-persistence-3.1.26"]
    paths: [".github/workflows/prepare-3.1.26.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/thermal-effectiveness-persistence-3.1.26
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Prepare 3.1.26 release surfaces
        run: |
          python scripts/release_prepare.py \
            --version 3.1.26 \
            --release-date 2026-10-30 \
            --restart-required none \
            --summary-en "Persist Thermal Predictor effectiveness diagnostics across add-on and process restarts without changing cooling policy." \
            --summary-pl "Zachowano statystyki skuteczności Thermal Predictora między restartami aplikacji i procesu bez zmiany polityki chłodzenia." \
            --fixed-en "Persist Thermal Predictor effectiveness counters, pending observations and 30/60/120-second horizon results in a dedicated atomic checkpoint." \
            --fixed-en "Migrate the 3.1.25 schema-1 effectiveness state without losing collected diagnostic evidence." \
            --fixed-pl "Dodano trwały atomowy checkpoint dla liczników skuteczności Thermal Predictora, oczekujących obserwacji oraz wyników 30/60/120 s." \
            --fixed-pl "Dodano migrację stanu skuteczności schema 1 z wersji 3.1.25 bez utraty zebranych danych diagnostycznych." \
            --performance-en "No additional polling loop or background worker; persistence runs only when effectiveness state changes." \
            --performance-pl "Bez dodatkowej pętli odpytywania i procesu w tle; zapis trwały wykonywany jest tylko po zmianie stanu skuteczności."

      - name: Remove one-shot workflow and commit prepared release
        run: |
          rm -f .github/workflows/prepare-3.1.26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare SBC5 Control Center 3.1.26 release" || exit 0
          git push origin HEAD:fix/thermal-effectiveness-persistence-3.1.26
