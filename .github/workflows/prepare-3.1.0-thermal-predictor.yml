name: Prepare SBC5 3.1.0 Thermal Predictor

on:
  push:
    branches:
      - ai/thermal-predictor-3.1.0
    paths:
      - scripts/prepare_3_1_0_thermal_predictor.py
      - .github/workflows/prepare-3.1.0-thermal-predictor.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/thermal-predictor-3.1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Apply Thermal Predictor module
        run: python scripts/prepare_3_1_0_thermal_predictor.py
      - name: Prepare professional release metadata
        run: |
          python scripts/release_prepare.py \
            --version 3.1.0 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Introduce AI Thermal Predictor as an observe-only short-horizon temperature forecasting module." \
            --summary-pl "Wprowadzono AI Thermal Predictor jako obserwacyjny moduł krótkoterminowej prognozy temperatury." \
            --added-en "AI Thermal Predictor forecasts CPU temperature 30, 60 and 120 seconds ahead without controlling PWM." \
            --added-pl "AI Thermal Predictor prognozuje temperaturę CPU z wyprzedzeniem 30, 60 i 120 sekund bez sterowania PWM." \
            --added-en "Online forecast validation measures prediction MAE and derives predictor confidence from real runtime outcomes." \
            --added-pl "Walidacja online mierzy błąd MAE prognoz i wylicza confidence predyktora na podstawie rzeczywistych wyników runtime." \
            --added-en "Recorder-friendly Home Assistant sensors expose 30/60/120-second forecasts and predictor confidence." \
            --added-pl "Dodano sensory Home Assistant przyjazne Recorderowi dla prognoz 30/60/120 s oraz confidence predyktora." \
            --performance-en "Thermal Predictor reuses the existing 10-second AI evaluation cycle and temperature window; no extra polling loop or background process is introduced." \
            --performance-pl "Thermal Predictor wykorzystuje istniejący 10-sekundowy cykl AI i okno temperatury; nie dodaje nowej pętli pollingu ani osobnego procesu." \
            --changed-en "Adaptive PWM and AI Cooling remain authoritative; Thermal Predictor is observe-only in 3.1.0." \
            --changed-pl "Adaptive PWM i AI Cooling pozostają nadrzędne; Thermal Predictor w 3.1.0 działa wyłącznie obserwacyjnie."
      - name: Validate runtime and release
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          cargo check --release --manifest-path local_apps/sbc5_control_center/rust-core/Cargo.toml
      - name: Predictor smoke test
        run: |
          python local_apps/sbc5_control_center/ai_cooling.py --help >/dev/null
          grep -q 'thermal_predictor' local_apps/sbc5_control_center/ai_cooling.py
          grep -q 'sbc5_ai_thermal_forecast_60s' packages/sbc5_control_center.yaml
      - name: Commit clean candidate
        run: |
          set -euo pipefail
          git rm scripts/prepare_3_1_0_thermal_predictor.py .github/workflows/prepare-3.1.0-thermal-predictor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SBC5 Control Center 3.1.0 — AI Thermal Predictor"
          git push origin HEAD:ai/thermal-predictor-3.1.0
