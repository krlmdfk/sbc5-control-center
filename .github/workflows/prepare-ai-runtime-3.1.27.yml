name: One-shot prepare AI runtime relay recovery 3.1.27

on:
  push:
    branches:
      - fix/ai-runtime-relay-recovery-3.1.27

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-runtime-relay-recovery-3.1.27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch relay recovery and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          run = Path('local_apps/sbc5_control_center/run_legacy.sh')
          text = run.read_text(encoding='utf-8')
          old = '''      if [ -z "${AI_RUNTIME_LAST_SIGNATURE:-}" ] || [ "$ai_runtime_signature" != "$AI_RUNTIME_LAST_SIGNATURE" ]; then
        ai_runtime_due=true
      elif [ "${TELEMETRY_LAST_AI_RELAY_PUBLISH:-0}" -eq 0 ] 2>/dev/null || [ $((relay_now - TELEMETRY_LAST_AI_RELAY_PUBLISH)) -ge "$AI_RUNTIME_RELAY_KEEPALIVE_SECONDS" ] 2>/dev/null; then
        ai_runtime_due=true
      fi
'''
          new = '''      # 3.1.27: REST-created states disappear on a Home Assistant Core restart.
      # A short Core restart can happen entirely between UX availability polls, leaving
      # the unchanged-payload signature cached and delaying recreation until keepalive.
      # Probe only on the existing 30 s AI-relay cadence and force a publish when the
      # canonical runtime entity is missing; this adds no new loop and no duplicate
      # Recorder writes while the state exists.
      local ai_runtime_entity_present=true
      if ! curl -fsS -H "Authorization: Bearer ${SUPERVISOR_TOKEN}" \
        http://supervisor/core/api/states/sensor.sbc5_control_center_ai_runtime >/dev/null 2>&1; then
        ai_runtime_entity_present=false
      fi
      if [ "$ai_runtime_entity_present" != "true" ]; then
        ai_runtime_due=true
      elif [ -z "${AI_RUNTIME_LAST_SIGNATURE:-}" ] || [ "$ai_runtime_signature" != "$AI_RUNTIME_LAST_SIGNATURE" ]; then
        ai_runtime_due=true
      elif [ "${TELEMETRY_LAST_AI_RELAY_PUBLISH:-0}" -eq 0 ] 2>/dev/null || [ $((relay_now - TELEMETRY_LAST_AI_RELAY_PUBLISH)) -ge "$AI_RUNTIME_RELAY_KEEPALIVE_SECONDS" ] 2>/dev/null; then
        ai_runtime_due=true
      fi
'''
          if old not in text:
              raise SystemExit('AI runtime relay decision block not found')
          run.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('scripts/test_ai_runtime_relay_recovery_3_1_27.py')
          test.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\n\ntext = Path("local_apps/sbc5_control_center/run_legacy.sh").read_text(encoding="utf-8")\nprobe = "http://supervisor/core/api/states/sensor.sbc5_control_center_ai_runtime"\nassert probe in text, "missing AI runtime existence probe"\nassert "ai_runtime_entity_present=false" in text\nassert 'if [ "$ai_runtime_entity_present" != "true" ]; then' in text\nassert text.index(probe) < text.index('if [ "$ai_runtime_entity_present" != "true" ]; then')\nassert text.index('if [ "$ai_runtime_entity_present" != "true" ]; then') < text.index('elif [ -z "${AI_RUNTIME_LAST_SIGNATURE:-}" ]')\nassert "AI_RUNTIME_RELAY_INTERVAL_SECONDS=30" in text\nassert "AI_RUNTIME_RELAY_KEEPALIVE_SECONDS=300" in text\nprint("AI runtime relay recovery regression: PASS")\n''', encoding='utf-8')

          wf = Path('.github/workflows/validate.yml')
          v = wf.read_text(encoding='utf-8')
          anchor = '''      - name: Test AI runtime layer wiring\n        run: python scripts/test_ai_runtime_wiring_3_1_20.py\n'''
          insert = anchor + '''\n      - name: Test AI runtime relay recovery after Home Assistant restart\n        run: python scripts/test_ai_runtime_relay_recovery_3_1_27.py\n'''
          if anchor not in v:
              raise SystemExit('validate workflow anchor not found')
          wf.write_text(v.replace(anchor, insert, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/prepare-ai-runtime-3.1.27.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recreate AI runtime relay after Home Assistant restart"
          git push origin HEAD:fix/ai-runtime-relay-recovery-3.1.27
