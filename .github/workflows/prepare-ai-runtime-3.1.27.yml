name: Prepare AI runtime relay recovery 3.1.27

on:
  push:
    branches:
      - fix/ai-runtime-relay-recovery-3.1.27

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-runtime-relay-recovery-3.1.27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply runtime patch
        run: python scripts/patch_ai_runtime_recovery_3_1_27.py
      - name: Commit prepared patch
        run: |
          rm -f .github/workflows/prepare-ai-runtime-3.1.27.yml
          rm -f scripts/patch_ai_runtime_recovery_3_1_27.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recreate AI runtime relay after Home Assistant restart"
          git push origin HEAD:fix/ai-runtime-relay-recovery-3.1.27
