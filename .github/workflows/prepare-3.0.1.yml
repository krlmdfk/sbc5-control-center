name: Prepare SBC5 3.0.1

on:
  push:
    branches:
      - maintenance/3.0.1
    paths:
      - scripts/prepare_3_0_1.py
      - .github/workflows/prepare-3.0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Prepare 3.0.1
        run: python scripts/prepare_3_0_1.py

      - name: Rebuild manifest hashes
        run: python scripts/update_manifest_hashes.py

      - name: Validate shell
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh

      - name: Compile Python
        run: |
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate Rust Core
        working-directory: local_apps/sbc5_control_center/rust-core
        run: cargo check --release

      - name: Regression tests
        run: |
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py

      - name: Strict release validation
        run: python scripts/validate_release.py --strict-manifest-hashes

      - name: Build local update artifact
        run: |
          mkdir -p dist
          python scripts/build_local_update.py --output dist/SBC5_UPDATE_3.0.1.zip
          sha256sum dist/SBC5_UPDATE_3.0.1.zip | tee dist/SBC5_UPDATE_3.0.1.sha256

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbc5-3.0.1-maintenance-preflight
          path: |
            dist/SBC5_UPDATE_3.0.1.zip
            dist/SBC5_UPDATE_3.0.1.sha256
            update-manifest.json
          if-no-files-found: error

      - name: Commit prepared candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "Prepare SBC5 Control Center 3.0.1 maintenance candidate"
          git push origin HEAD:maintenance/3.0.1
