name: SBC5 3.2.0 RC package verification

on:
  push:
    branches:
      - release/global-3.2.0-20261108
    paths:
      - .github/workflows/global-3-2-0-rc-artifact.yml
      - local_apps/sbc5_control_center/release.json
      - update-manifest.json
      - scripts/build_local_update.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Validate release metadata, source and manifest integrity
        run: |
          python scripts/test_global_release_readiness_3_2_0.py
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_dockerfile_runtime_paths.py
          python scripts/test_thermal_guidance_context_reset.py
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('local_apps/sbc5_control_center/release.json').read_text())
          assert release['version'] == '3.2.0', release['version']
          print('RC version 3.2.0 confirmed')
          PY
      - name: Build and reverify offline RC archive
        run: |
          mkdir -p dist
          python scripts/build_local_update.py --output dist/SBC5_3.2.0_RC_OFFLINE_ONLY.zip
          python scripts/build_local_update.py --verify-only --output dist/SBC5_3.2.0_RC_OFFLINE_ONLY.zip
          sha256sum dist/SBC5_3.2.0_RC_OFFLINE_ONLY.zip > dist/SBC5_3.2.0_RC_OFFLINE_ONLY.zip.sha256
      - name: Include explicit offline-only handling notice
        run: |
          cat > dist/READ_ME_FIRST.txt <<'TXT'
          SBC5 Control Center 3.2.0 RELEASE CANDIDATE — OFFLINE INSPECTION ONLY.
          This is NOT an installable update for the running, Store-managed 3.1.37 App.
          Do NOT put this archive into /config/sbc5_control_center_updates/.
          No GitHub Release, tag or production installation is performed by this workflow.
          TXT
      - name: Upload candidate as CI artifact only
        uses: actions/upload-artifact@v4
        with:
          name: SBC5-3.2.0-RC-OFFLINE-INSPECTION-ONLY
          path: dist/
          retention-days: 7
          if-no-files-found: error
