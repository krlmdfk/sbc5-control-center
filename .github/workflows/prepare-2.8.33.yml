name: Prepare 2.8.33 Release Candidate

on:
  push:
    branches:
      - release/2.8.33
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-2.8.33
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Detect already-prepared release
        id: prepared
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("local_apps/sbc5_control_center/release.json"))["version"])')"
          if [ "$VERSION" = "2.8.33" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare unified 2.8.33 release
        if: steps.prepared.outputs.done != 'true'
        run: |
          python scripts/release_prepare.py \
            --version 2.8.33 \
            --release-date 2026-10-26 \
            --restart-required home_assistant \
            --summary-en "Maintenance release adding a verified, fail-closed durable-state handoff for safe Rust 3.0.0 canary migration; cooling and AI control behavior is unchanged." \
            --summary-pl "Wydanie serwisowe dodające zweryfikowany, bezpiecznie blokowany handoff trwałego stanu do testowej migracji Rust 3.0.0; działanie chłodzenia i sterowania AI pozostaje bez zmian." \
            --added-en "Added schema-2 durable-state handoff for stable Store to newer stopped canary instances with exact target, target-version and SHA-256 fingerprint validation." \
            --added-pl "Dodano handoff trwałego stanu schema 2 ze stabilnej instancji Store do nowszej zatrzymanej instancji canary, z dokładną walidacją celu, wersji docelowej i fingerprintu SHA-256." \
            --changed-en "Stable 2.8.x Store instances can act as read-only migration sources for an installed newer canary without deprecating or modifying their private /data state." \
            --changed-pl "Stabilna instancja Store 2.8.x może działać jako źródło migracji tylko do odczytu dla zainstalowanej nowszej wersji canary, bez deprecjonowania ani modyfikowania własnego prywatnego /data." \
            --fixed-en "Foreign or stale migration handoffs are ignored instead of being treated as destructive import failures; a targeted canary waits fail-closed while the stable source is running or verification is incomplete." \
            --fixed-pl "Obce lub nieaktualne handoffy migracyjne są ignorowane zamiast powodować destrukcyjne błędy importu; docelowa instancja canary oczekuje w trybie fail-closed, gdy stabilne źródło działa lub weryfikacja nie jest kompletna." \
            --security-en "Canary import is restricted to an allow-list of durable state files and requires exact per-file SHA-256 hashes plus a complete aggregate fingerprint before data is accepted." \
            --security-pl "Import canary jest ograniczony do listy dozwolonych plików trwałego stanu i wymaga dokładnych hashy SHA-256 każdego pliku oraz pełnego fingerprintu zbiorczego przed zaakceptowaniem danych."

      - name: Ensure handoff-v2 files are in release manifest
        if: steps.prepared.outputs.done != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('update-manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          files = data.setdefault('files', {})
          for rel in [
              'local_apps/sbc5_control_center/migration_manager_v2.py',
              'scripts/test_canary_migration.py',
          ]:
              if not Path(rel).is_file():
                  raise SystemExit(f'missing required handoff-v2 file: {rel}')
              files.setdefault(rel, '')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/update_manifest_hashes.py

      - name: Validate 2.8.33 release strictly
        if: steps.prepared.outputs.done != 'true'
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py

      - name: Build verified 2.8.33 local update
        if: steps.prepared.outputs.done != 'true'
        run: |
          mkdir -p dist
          python scripts/build_local_update.py --output dist/SBC5_UPDATE_2.8.33.zip
          sha256sum dist/SBC5_UPDATE_2.8.33.zip | tee dist/SBC5_UPDATE_2.8.33.sha256
          cp update-manifest.json dist/update-manifest-2.8.33.json
          cp RELEASE_NOTES_2.8.33.md dist/RELEASE_NOTES_2.8.33.md

      - name: Upload 2.8.33 preflight artifact
        if: steps.prepared.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbc5-2.8.33-release-candidate
          path: |
            dist/SBC5_UPDATE_2.8.33.zip
            dist/SBC5_UPDATE_2.8.33.sha256
            dist/update-manifest-2.8.33.json
            dist/RELEASE_NOTES_2.8.33.md
          if-no-files-found: error

      - name: Commit prepared release candidate
        if: steps.prepared.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare SBC5 Control Center 2.8.33 release candidate"
          git push origin HEAD:release/2.8.33
