name: one-shot cleanup 3.1.4
on:
  push:
    branches:
      - fix/3.1.4-runtime-consistency
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.4-runtime-consistency
      - name: Remove one-shot files
        run: |
          rm -f scripts/_oneshot_patch_3_1_4.py
          rm -f .github/workflows/_oneshot_patch_3_1_4.yml
      - name: Commit clean branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove 3.1.4 one-shot helpers'
          git push origin HEAD:fix/3.1.4-runtime-consistency
