name: one-shot patch 3.1.4
on:
  push:
    branches:
      - fix/3.1.4-runtime-consistency
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.4-runtime-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Apply patch
        run: python scripts/_oneshot_patch_3_1_4.py
      - name: Regenerate card JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          root = Path('.')
          pairs = [
              (root/'dashboard/sbc5_control_center_diagnostics_card.yaml', root/'local_apps/sbc5_control_center/dashboard_card.json'),
              (root/'dashboard/update_status_card.yaml', root/'local_apps/sbc5_control_center/update_status_card.json'),
          ]
          for src, dst in pairs:
              data = yaml.safe_load(src.read_text(encoding='utf-8'))
              dst.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Sync bundled integration
        run: |
          rm -rf local_apps/sbc5_control_center/bridge
          cp -a custom_components/sbc5_control_center local_apps/sbc5_control_center/bridge
      - name: Validate syntax
        run: |
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('dashboard/sbc5_control_center_diagnostics_card.yaml').read_text(encoding='utf-8'))
          yaml.safe_load(Path('dashboard/update_status_card.yaml').read_text(encoding='utf-8'))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: runtime consistency and predictor confidence for 3.1.4'
          git push origin HEAD:fix/3.1.4-runtime-consistency
