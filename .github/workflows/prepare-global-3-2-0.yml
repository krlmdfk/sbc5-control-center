name: Prepare SBC5 Global Edition 3.2.0 candidate

on:
  push:
    branches:
      - release/global-3.2.0-20261108
    paths:
      - .github/workflows/prepare-global-3-2-0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Generate canonical 3.2.0 version and release metadata
        run: |
          python scripts/release_prepare.py \
            --version 3.2.0 \
            --release-date 2026-11-08 \
            --restart-required none \
            --summary-en "Global Community Edition for Raspberry Pi 5: international installation guide, explicit host-access security disclosure and platform-specific installation." \
            --summary-pl "Wydanie społecznościowe Global Edition dla Raspberry Pi 5: globalna instalacja, jawny audyt uprawnień i ograniczenie platformy docelowej." \
            --added-en "Document global installation, security review and mandatory real-device release gates in English and Polish." \
            --added-pl "Dodano dwujęzyczną instrukcję instalacji globalnej, audyt bezpieczeństwa oraz wymagane testy na urządzeniu." \
            --changed-en "Target raspberrypi5-64 explicitly to avoid offering the App on unsupported aarch64 boards." \
            --changed-pl "Ograniczono dostępność aplikacji do raspberrypi5-64 zamiast wszystkich urządzeń aarch64." \
            --security-en "Disclose full_access, host_pid, AppArmor disablement and elevated Supervisor/kernel privileges; do not reduce privileges without hardware validation." \
            --security-pl "Jawnie opisano full_access, host_pid, wyłączenie AppArmor oraz uprawnienia Supervisor i systemu; bez zmiany uprawnień przed testami sprzętowymi."
      - name: Validate prepared release candidate
        run: |
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_global_release_readiness_3_2_0.py
          python scripts/test_thermal_guidance_context_reset.py
          python -m compileall -q local_apps/sbc5_control_center scripts
          python scripts/build_local_update.py --output /tmp/SBC5_GLOBAL_3.2.0_RC.zip
      - name: Commit generated release candidate to branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'chore(release): prepare 3.2.0 Global Community Edition candidate'
          git push origin HEAD:release/global-3.2.0-20261108
