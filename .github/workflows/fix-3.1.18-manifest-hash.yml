name: Refresh 3.1.18 manifest hash

on:
  push:
    branches:
      - fix/3.1.18-manifest-hash-final
    paths:
      - .github/workflows/fix-3.1.18-manifest-hash.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh validate.yml SHA-256 in update manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('update-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target = Path('.github/workflows/validate.yml')
          data['files'][str(target)] = hashlib.sha256(target.read_bytes()).hexdigest()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(data['files'][str(target)])
          PY
      - name: Verify strict manifest
        run: python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit refreshed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "fix: refresh 3.1.18 validate manifest hash"
          git push origin HEAD:fix/3.1.18-manifest-hash-final
