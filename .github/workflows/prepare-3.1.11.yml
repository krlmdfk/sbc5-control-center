name: Prepare 3.1.11 release

on:
  push:
    branches:
      - release/3.1.11-ai-v5-transient-learning

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.1.11-ai-v5-transient-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare 3.1.11
        run: |
          python scripts/release_prepare.py \
            --version 3.1.11 \
            --restart-required none \
            --summary-en "AI Cooling v5.1 learns bounded transient thermal evidence from short medium/high workload bursts without changing steady-state PWM predictions." \
            --summary-pl "AI Cooling v5.1 uczy się ograniczonych dowodów dynamicznej odpowiedzi cieplnej z krótkich obciążeń medium/high bez zmiany predykcji steady-state PWM." \
            --added-en "AI Cooling v5.1 transient-response learning for short medium/high workload bursts." \
            --added-pl "AI Cooling v5.1 z uczeniem odpowiedzi przejściowej dla krótkich obciążeń medium/high." \
            --changed-en "Dynamic evidence raises transfer confidence only; it does not increment qualified counters or directly alter steady-state PWM prediction." \
            --changed-pl "Dowody dynamiczne zwiększają wyłącznie pewność transferu; nie zwiększają liczników qualified i nie zmieniają bezpośrednio predykcji steady-state PWM." \
            --fixed-en "Medium/high bursts rejected by the quasi-steady v4 qualifier can now contribute bounded learning evidence instead of being discarded completely." \
            --fixed-pl "Krótkie obciążenia medium/high odrzucone przez kwalifikator quasi-steady v4 mogą teraz wnosić ograniczony sygnał uczący zamiast być całkowicie pomijane." \
            --performance-en "No new polling loop; v5.1 runs inside the existing 10-second AI evaluator." \
            --performance-pl "Brak nowej pętli pollingu; v5.1 działa wewnątrz istniejącego ewaluatora AI co 10 s."
      - name: Run validation
        run: |
          python scripts/test_ai_v5_1_transient_learning.py
          python scripts/validate_release.py --strict-manifest-hashes
          git diff --check
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare release 3.1.11"
          git push origin HEAD:release/3.1.11-ai-v5-transient-learning
