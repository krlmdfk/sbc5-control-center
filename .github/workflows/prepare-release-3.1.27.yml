name: Prepare SBC5 3.1.27 release

on:
  push:
    branches:
      - fix/ai-runtime-relay-recovery-3.1.27

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-runtime-relay-recovery-3.1.27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare professional bilingual release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.27 \
            --release-date 2026-10-30 \
            --restart-required none \
            --summary-en "Recover the REST-backed AI Runtime relay immediately after Home Assistant Core restarts, preventing temporary unavailable AI and Thermal Predictor sensors." \
            --summary-pl "Natychmiast odtwarza relay AI Runtime oparty o REST po restarcie Home Assistant Core, eliminując czasową niedostępność sensorów AI i Thermal Predictora." \
            --fixed-en "Detect a missing sensor.sbc5_control_center_ai_runtime on the existing 30-second relay cadence and republish it without waiting for the 5-minute keepalive." \
            --fixed-pl "Wykrywa brak sensor.sbc5_control_center_ai_runtime w istniejącym 30-sekundowym cyklu relay i publikuje go ponownie bez oczekiwania na 5-minutowy keepalive." \
            --performance-en "No additional background loop; the existence probe reuses the existing AI relay cadence and does not change cooling control." \
            --performance-pl "Bez dodatkowej pętli w tle; sprawdzenie istnienia encji wykorzystuje istniejący cykl AI relay i nie zmienia sterowania chłodzeniem."
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/prepare-release-3.1.27.yml'
          git commit -m "release: prepare SBC5 Control Center 3.1.27"
          git push origin HEAD:fix/ai-runtime-relay-recovery-3.1.27
