name: Apply Thermal Predictor log patch 3.1.21

on:
  push:
    branches: ["feature/3.1.21-thermal-predictor-active-assist"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.1.21-thermal-predictor-active-assist
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_thermal_predictor_log_3_1_21.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "krlmdfk"
          git config user.email "82178819+krlmdfk@users.noreply.github.com"
          git add local_apps/sbc5_control_center/run_legacy.sh
          git commit -m "feat: add Thermal Predictor runtime diagnostics log"
          git push origin HEAD:feature/3.1.21-thermal-predictor-active-assist
