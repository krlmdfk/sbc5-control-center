name: one-shot release 3.1.4
on:
  push:
    branches:
      - fix/3.1.4-runtime-consistency
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.4-runtime-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.4 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Fix runtime version/status consistency, reconcile legacy CPU restart markers, and calibrate AI Thermal Predictor confidence to measured error." \
            --summary-pl "Naprawa spójności wersji i statusów runtime, uzgadnianie legacy markerów restartu CPU oraz kalibracja confidence AI Thermal Predictor do rzeczywistego błędu." \
            --added-en "Expose AI Thermal Predictor quality state as a native Home Assistant sensor and on the expanded AI card." \
            --added-pl "Udostępniono stan jakości AI Thermal Predictor jako natywny sensor Home Assistant i na rozwijanej karcie AI." \
            --fixed-en "Normalize SBC5 Package Version and current runtime version surfaces structurally during every release so stale literals such as 2.8.34 cannot survive future version bumps." \
            --fixed-pl "Każde wydanie strukturalnie normalizuje wersję pakietu SBC5 i bieżące powierzchnie runtime, dzięki czemu stare wartości takie jak 2.8.34 nie mogą przetrwać kolejnych aktualizacji." \
            --fixed-en "Reconcile legacy generic restart=host CPU/OC markers only when the marker reason identifies CPU configuration and Boot Verification proves the persisted requested profile is already active." \
            --fixed-pl "Legacy marker restart=host o ogólnym scope jest zamykany tylko wtedy, gdy powód jednoznacznie wskazuje CPU/OC, a Boot Verification potwierdza zgodność zapisanego żądanego profilu ze stanem aktywnym." \
            --fixed-en "Use persistent host telemetry as a Lovelace fallback for platform compatibility and show the known installed version while transient update-state publication resynchronizes after Home Assistant Core restart." \
            --fixed-pl "Karta Lovelace korzysta z trwałej telemetrii hosta jako fallbacku zgodności platformy i pokazuje znaną wersję zainstalowaną podczas ponownej synchronizacji chwilowego statusu aktualizacji po restarcie Home Assistant Core." \
            --changed-en "Reweight AI Thermal Predictor confidence so prediction accuracy contributes 35 percent of the score; MAE around 2-3 C can no longer report confidence above 90 percent." \
            --changed-pl "Zmieniono wagę confidence AI Thermal Predictor: dokładność predykcji odpowiada za 35 procent wyniku, więc MAE około 2-3 C nie może już generować confidence powyżej 90 procent." \
            --performance-en "No new polling loops and no Adaptive PWM or AI Cooling control changes; all fixes reuse existing telemetry, coordinator and runtime paths." \
            --performance-pl "Bez nowych pętli odpytywania i bez zmian sterowania Adaptive PWM ani AI Cooling; poprawki wykorzystują istniejącą telemetrię, koordynator i ścieżki runtime."
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare SBC5 Control Center 3.1.4'
          git push origin HEAD:fix/3.1.4-runtime-consistency
