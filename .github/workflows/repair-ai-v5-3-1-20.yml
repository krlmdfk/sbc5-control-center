name: Repair AI v5 runtime path for 3.1.20

on:
  push:
    branches:
      - feature/3.1.20-ai-runtime-history-hotfix
    paths:
      - .github/workflows/repair-ai-v5-3-1-20.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.1.20-ai-runtime-history-hotfix
          fetch-depth: 0
      - name: Restore v5 from main and patch only runtime path
        run: |
          git fetch origin main
          git checkout origin/main -- local_apps/sbc5_control_center/ai_cooling_v5.py
          python - <<'PY'
          from pathlib import Path
          p = Path('local_apps/sbc5_control_center/ai_cooling_v5.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _legacy_path() -> Path:\n    runtime = Path("/ai_cooling_legacy.py")\n    if runtime.is_file():\n        return runtime\n    return Path(__file__).with_name("ai_cooling.py")\n'''
          new = '''def _legacy_path() -> Path:\n    runtime = Path("/ai_cooling_v4.py")\n    if runtime.is_file():\n        return runtime\n    return Path(__file__).with_name("ai_cooling.py")\n'''
          if old not in s:
              raise SystemExit('expected _legacy_path block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/test_ai_runtime_wiring_3_1_20.py
      - name: Commit minimal repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_apps/sbc5_control_center/ai_cooling_v5.py
          git commit -m "fix: minimally route AI v5 through v4 compatibility layer"
          git push origin HEAD:feature/3.1.20-ai-runtime-history-hotfix
