name: Prepare SBC5 3.1.25 effectiveness release

on:
  push:
    branches:
      - feat/thermal-effectiveness-3.1.25

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/thermal-effectiveness-3.1.25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preparer dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Apply effectiveness diagnostics
        run: python scripts/prepare_3_1_25_effectiveness.py
      - name: Prepare release metadata
        run: |
          python scripts/release_prepare.py \
            --version 3.1.25 \
            --restart-required none \
            --summary-en "Measure observed Thermal Predictor post-intervention effectiveness at 30/60/120 seconds without changing cooling policy." \
            --summary-pl "Dodano obserwacyjny pomiar skuteczności interwencji Thermal Predictora po 30/60/120 sekundach bez zmiany polityki chłodzenia."
      - name: Rebuild manifest hashes
        run: python scripts/update_manifest_hashes.py
      - name: Validate release
        run: |
          python scripts/validate_release.py
          python scripts/test_thermal_predictor_guided_3_1_21.py
          python -m py_compile local_apps/sbc5_control_center/thermal_effectiveness.py local_apps/sbc5_control_center/ai_cooling_v5_2.py
          git diff --check
      - name: Remove one-shot preparer
        run: |
          rm -f .github/workflows/prepare-3.1.25.yml
          rm -f scripts/prepare_3_1_25_effectiveness.py
      - name: Commit prepared 3.1.25
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Prepare SBC5 Control Center 3.1.25 effectiveness diagnostics"
          git push origin HEAD:feat/thermal-effectiveness-3.1.25
