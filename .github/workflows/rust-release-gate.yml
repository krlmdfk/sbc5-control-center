name: Rust 3.0.0 Release Gate

on:
  push:
    branches:
      - migration/rust-3.0.0

permissions:
  contents: write

concurrency:
  group: rust-3.0.0-release-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Align 3.0.0 update manifest and runtime allow-list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("update-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "3.0.0"
          data["package_version"] = "3.0.0"
          data["card_ui_version"] = "3.0.0"
          data["release_date"] = "2026-10-26"
          data["summary"] = (
              "Rust Core migration: native low-overhead telemetry and runtime health with "
              "automatic compatibility fallback while preserving Adaptive PWM, AI Cooling, "
              "CPU/GPU profiles and persistent /data state."
          )

          files = data.setdefault("files", {})
          required = [
              "local_apps/sbc5_control_center/run_legacy.sh",
              "local_apps/sbc5_control_center/rust-core/Cargo.toml",
              "local_apps/sbc5_control_center/rust-core/src/main.rs",
              "local_apps/sbc5_control_center/RUST_MIGRATION.md",
          ]
          for rel in required:
              if not Path(rel).is_file():
                  raise SystemExit(f"Required Rust migration file missing: {rel}")
              files.setdefault(rel, "")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Rebuild manifest SHA-256 hashes
        run: python scripts/update_manifest_hashes.py

      - name: Validate shell compatibility
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh

      - name: Validate release strictly
        run: python scripts/validate_release.py --strict-manifest-hashes

      - name: Run migration regression tests
        run: |
          python scripts/test_migration_profile_guard.py
          python scripts/test_runtime_robustness.py

      - name: Build verified 3.0.0 local update
        run: |
          mkdir -p dist
          python scripts/build_local_update.py --output dist/SBC5_UPDATE_3.0.0.zip
          sha256sum dist/SBC5_UPDATE_3.0.0.zip | tee dist/SBC5_UPDATE_3.0.0.sha256
          cp update-manifest.json dist/update-manifest-3.0.0.json

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbc5-rust-3.0.0-preflight
          path: |
            dist/SBC5_UPDATE_3.0.0.zip
            dist/SBC5_UPDATE_3.0.0.sha256
            dist/update-manifest-3.0.0.json
          if-no-files-found: error

      - name: Persist exact 3.0.0 manifest on migration branch
        run: |
          if git diff --quiet -- update-manifest.json; then
            echo "update-manifest.json already exact for 3.0.0"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "Finalize 3.0.0 Rust update manifest"
          git push origin HEAD:migration/rust-3.0.0
