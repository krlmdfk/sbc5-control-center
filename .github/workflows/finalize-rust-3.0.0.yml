name: Finalize Rust 3.0.0

on:
  push:
    branches:
      - migration/rust-3.0.0-finalize
    paths:
      - .github/workflows/finalize-rust-3.0.0.yml
      - scripts/finalize_rust_3_0_0.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/rust-3.0.0-finalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Finalize public 3.0.0 surfaces
        run: python scripts/finalize_rust_3_0_0.py
      - name: Rebuild manifest hashes
        run: python scripts/update_manifest_hashes.py
      - name: Validate final candidate
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m py_compile local_apps/sbc5_control_center/dashboard_sync.py local_apps/sbc5_control_center/migration_manager.py local_apps/sbc5_control_center/migration_manager_v2.py local_apps/sbc5_control_center/ai_cooling.py
          cargo check --manifest-path local_apps/sbc5_control_center/rust-core/Cargo.toml --release
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          python scripts/validate_release.py --strict-manifest-hashes
          grep -q 'odzyskano osierocone przejęcie' local_apps/sbc5_control_center/run_legacy.sh
          grep -q '_runtime_versioned_card' local_apps/sbc5_control_center/dashboard_sync.py
          grep -q 'supervisor_sync_migrated_options_to_store' local_apps/sbc5_control_center/run_legacy.sh
          git diff --check
      - name: Commit finalized candidate
        run: |
          rm -f .github/workflows/finalize-rust-3.0.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize verified Rust hybrid release 3.0.0"
          git push origin HEAD:migration/rust-3.0.0-finalize
