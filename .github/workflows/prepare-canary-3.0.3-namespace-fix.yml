name: Prepare Rust Canary 3.0.3 Namespace Fix

on:
  push:
    branches:
      - test/rust-3.0.0-canary
    paths:
      - .github/workflows/prepare-canary-3.0.3-namespace-fix.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rust-3.0.0-canary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Fix namespace control handoff
        shell: python
        run: |
          from pathlib import Path
          p = Path('local_apps/sbc5_control_center/run_legacy.sh')
          s = p.read_text(encoding='utf-8')
          old = '''namespace_control_allowed() {
            local owner="sbc5"
            if [ -s "$NAMESPACE_CONTROL_FILE" ]; then owner="$(jq -r '.owner // "legacy"' "$NAMESPACE_CONTROL_FILE" 2>/dev/null || echo legacy)"; fi
            [ "$owner" = "sbc5" ]
          }
          '''
          new = '''namespace_control_allowed() {
            # A completed namespace migration is authoritative: the canonical SBC5
            # runtime owns control even if an obsolete control_owner.json survived
            # an older migration/rollback cycle. During an unfinished migration the
            # explicit owner marker remains the safety interlock.
            if [ "$(jq -r '.phase // empty' "$NAMESPACE_MIGRATION_DIR/state.json" 2>/dev/null || true)" = "COMPLETE" ]; then
              return 0
            fi
            local owner="sbc5"
            if [ -s "$NAMESPACE_CONTROL_FILE" ]; then owner="$(jq -r '.owner // "legacy"' "$NAMESPACE_CONTROL_FILE" 2>/dev/null || echo legacy)"; fi
            [ "$owner" = "sbc5" ]
          }
          '''
          if old not in s:
              raise SystemExit('namespace_control_allowed block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('scripts/test_runtime_robustness.py')
          ts = t.read_text(encoding='utf-8')
          marker = 'def main() -> int:'
          if marker not in ts:
              raise SystemExit('runtime test main marker not found')
          test_fn = '''def test_completed_namespace_is_authoritative() -> None:\n    runtime = (ROOT / "local_apps" / "sbc5_control_center" / "run_legacy.sh").read_text(encoding="utf-8")\n    block = runtime.split("namespace_control_allowed() {", 1)[1].split("}\n", 1)[0]\n    assert 'state.json' in block and 'COMPLETE' in block and 'return 0' in block\n\n\n'''
          if 'test_completed_namespace_is_authoritative' not in ts:
              ts = ts.replace(marker, test_fn + marker, 1)
              idx = ts.find(marker)
              main_start = ts.find('\n', idx) + 1
              ts = ts[:main_start] + '    test_completed_namespace_is_authoritative()\n' + ts[main_start:]
          t.write_text(ts, encoding='utf-8')
      - name: Prepare 3.0.3 release surfaces
        run: >-
          python scripts/release_prepare.py
          --version 3.0.3
          --release-date 2026-10-26
          --restart-required none
          --summary-en "Rust canary runtime fix: completed namespace migration now authoritatively enables canonical Adaptive PWM control."
          --summary-pl "Poprawka runtime Rust canary: zakończona migracja namespace nadrzędnie zezwala kanonicznemu Adaptive PWM na przejęcie sterowania."
          --fixed-en "Treat namespace phase COMPLETE as canonical SBC5 control ownership even if a stale legacy owner marker survives."
          --fixed-pl "Traktuj fazę namespace COMPLETE jako nadrzędne przejęcie sterowania przez kanoniczny SBC5 nawet przy pozostawionym starym markerze legacy."
      - name: Validate
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          python scripts/validate_release.py --strict-manifest-hashes
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/prepare-canary-3.0.3-namespace-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix completed namespace control in Rust canary 3.0.3"
          git push origin HEAD:test/rust-3.0.0-canary
