name: Publish SBC5 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New unified version (X.Y.Z)"
        required: true
        type: string
      release_date:
        description: "Release date YYYY-MM-DD (blank = today)"
        required: false
        type: string
      restart_required:
        description: "Restart required by the App update"
        required: true
        default: home_assistant
        type: choice
        options:
          - none
          - home_assistant
          - host
      summary_en:
        description: "Short English release summary"
        required: true
        type: string
      summary_pl:
        description: "Krótki polski opis wydania"
        required: true
        type: string
      dry_run:
        description: "Preflight only — build artifacts but do not publish"
        required: true
        default: true
        type: boolean
      hardware_verified:
        description: "Confirm REAL hardware testing before STABLE publication only"
        required: true
        default: false
        type: boolean
      release_channel:
        description: "Field-test prerelease (not stable) or stable after actual hardware validation"
        required: true
        default: field_test
        type: choice
        options:
          - field_test
          - stable
      field_test_acknowledged:
        description: "I have external backups; I accept that 3.2.1 is an UNVERIFIED FIELD-TEST, not a stable hardware-validated version"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  HACS_REPO: krlmdfk/sbc5-control-center-integration

concurrency:
  group: sbc5-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Block unverified publication
        if: ${{ !inputs.dry_run }}
        env:
          HARDWARE_VERIFIED: ${{ inputs.hardware_verified }}
          FIELD_TEST_ACKNOWLEDGED: ${{ inputs.field_test_acknowledged }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "3.2.1" || {
            echo "Only 3.2.1 is supported by this controlled release path." >&2
            exit 1
          }
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            test "$HARDWARE_VERIFIED" = "true" || {
              echo "STABLE publication blocked: real RPi5 hardware and rollback testing is required." >&2
              exit 1
            }
          elif [ "$RELEASE_CHANNEL" = "field_test" ]; then
            test "$FIELD_TEST_ACKNOWLEDGED" = "true" || {
              echo "FIELD TEST requires explicit consent and verified off-device backups." >&2
              exit 1
            }
            echo "::warning::3.2.1 FIELD TEST: no real-world thermal/hardware verification; marking release as prerelease."
          else
            echo "Unsupported release channel." >&2
            exit 1
          fi

      - name: Preflight version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python -c 'import json; print(json.load(open("local_apps/sbc5_control_center/release.json"))["version"])')"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Main release $VERSION already exists" >&2
            exit 1
          fi

      - name: Prepare unified release
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          RESTART_REQUIRED: ${{ inputs.restart_required }}
          SUMMARY_EN: ${{ inputs.summary_en }}
          SUMMARY_PL: ${{ inputs.summary_pl }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION"
            --restart-required "$RESTART_REQUIRED"
            --summary-en "$SUMMARY_EN"
            --summary-pl "$SUMMARY_PL"
          )
          if [ -n "$RELEASE_DATE" ]; then
            args+=(--release-date "$RELEASE_DATE")
          fi
          python scripts/release_prepare.py "${args[@]}"

      - name: Validate prepared release strictly
        run: python scripts/validate_release.py --strict-manifest-hashes

      - name: Build and verify install/update package
        run: |
          mkdir -p dist
          python scripts/build_local_update.py --output "dist/SBC5_UPDATE_${{ inputs.version }}.zip"
          python scripts/build_local_update.py --verify-only --output "dist/SBC5_UPDATE_${{ inputs.version }}.zip"
          python local_apps/sbc5_control_center/zip_security_preflight.py "dist/SBC5_UPDATE_${{ inputs.version }}.zip"
          cd dist
          sha256sum "SBC5_UPDATE_${{ inputs.version }}.zip" > "SBC5_UPDATE_${{ inputs.version }}.zip.sha256"

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbc5-${{ inputs.version }}-preflight
          path: |
            dist/SBC5_UPDATE_${{ inputs.version }}.zip
            dist/SBC5_UPDATE_${{ inputs.version }}.zip.sha256
            RELEASE_NOTES_${{ inputs.version }}.md

      - name: Verify HACS repository token
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/krlmdfk/sbc5-control-center-integration --jq '.full_name'
          echo "HACS repository token: read access OK"

      - name: Stop after dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run passed. Re-run with dry_run=false to publish."

      - name: Require HACS token for publication
        if: ${{ !inputs.dry_run }}
        env:
          HACS_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
        run: |
          test -n "$HACS_TOKEN" || { echo "Missing repository secret HACS_REPO_TOKEN" >&2; exit 1; }

      - name: Preflight HACS release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$HACS_REPO" >/dev/null 2>&1; then
            echo "HACS release $VERSION already exists" >&2
            exit 1
          fi

      - name: Clone and synchronize HACS repository
        if: ${{ !inputs.dry_run }}
        env:
          HACS_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
          VERSION: ${{ inputs.version }}
          SUMMARY_EN: ${{ inputs.summary_en }}
          SUMMARY_PL: ${{ inputs.summary_pl }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HACS_TOKEN}@github.com/${HACS_REPO}.git" /tmp/sbc5-hacs
          HACS_CURRENT="$(python -c 'import json; print(json.load(open("/tmp/sbc5-hacs/custom_components/sbc5_control_center/manifest.json"))["version"])')"
          if [ "$HACS_CURRENT" != "$CURRENT_VERSION" ] && [ "$HACS_CURRENT" != "$VERSION" ]; then
            echo "Unexpected HACS version: App=$CURRENT_VERSION HACS=$HACS_CURRENT target=$VERSION" >&2
            exit 1
          fi
          python scripts/sync_hacs_repo.py \
            --dest /tmp/sbc5-hacs \
            --version "$VERSION" \
            --summary-en "$SUMMARY_EN" \
            --summary-pl "$SUMMARY_PL"
          cd /tmp/sbc5-hacs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            if [ "$HACS_CURRENT" != "$VERSION" ]; then
              echo "Unexpected empty HACS diff when upgrading from $HACS_CURRENT to $VERSION" >&2
              exit 1
            fi
            echo "HACS $VERSION already synchronized; reusing the previously validated commit."
          else
            if [ "$HACS_CURRENT" = "$VERSION" ]; then
              # The code of the existing target may never be overwritten on retry.
              # Human-edited release summaries can legitimately differ, so permit
              # exactly three generated documentation files and nothing else.
              while IFS= read -r -d '' changed_path; do
                case "$changed_path" in
                  README.md|info.md|"RELEASE_NOTES_${VERSION}.md") ;;
                  *)
                    echo "Existing HACS $VERSION differs in non-documentation file: $changed_path" >&2
                    exit 1
                    ;;
                esac
              done < <(git diff --cached --name-only -z)
              echo "HACS $VERSION already synchronized; updating approved release documentation only."
            fi
            git commit -m "Release ${VERSION}"
            git push origin HEAD:main
          fi
          echo "HACS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for HACS/Hassfest/Syntax validation
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
          SHA: ${{ env.HACS_SHA }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 30); do
            run_id="$(gh api "repos/${HACS_REPO}/actions/workflows/validate.yml/runs?head_sha=${SHA}&event=push&per_page=5" --jq '.workflow_runs[0].id // empty')"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "HACS validation run not found" >&2; exit 1; }
          echo "Waiting for HACS validation run ${run_id}"
          for i in $(seq 1 90); do
            status="$(gh api "repos/${HACS_REPO}/actions/runs/${run_id}" --jq '.status')"
            conclusion="$(gh api "repos/${HACS_REPO}/actions/runs/${run_id}" --jq '.conclusion // empty')"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "HACS validation failed: $conclusion" >&2; exit 1; }
              echo "HACS validation PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for HACS validation" >&2
          exit 1

      - name: Commit and push main release metadata
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${VERSION}"
          git push origin HEAD:main
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish main GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          release_flags=(--latest)
          if [ "${{ inputs.release_channel }}" = "field_test" ]; then
            release_flags=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MAIN_SHA" \
            --title "SBC5 Control Center ${VERSION} (${{ inputs.release_channel }})" \
            --notes-file "RELEASE_NOTES_${VERSION}.md" \
            "${release_flags[@]}" \
            "dist/SBC5_UPDATE_${VERSION}.zip" \
            "dist/SBC5_UPDATE_${VERSION}.zip.sha256"

      - name: Publish HACS integration Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.HACS_REPO_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$HACS_REPO" >/dev/null 2>&1; then
            echo "HACS release $VERSION already exists" >&2
            exit 1
          fi
          release_flags=(--latest)
          if [ "${{ inputs.release_channel }}" = "field_test" ]; then
            release_flags=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "$HACS_REPO" \
            --target "$HACS_SHA" \
            --title "SBC5 Control Center Integration ${VERSION} (${{ inputs.release_channel }})" \
            --notes-file "/tmp/sbc5-hacs/RELEASE_NOTES_${VERSION}.md" \
            "${release_flags[@]}"

      - name: Publication summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Published SBC5 Control Center ${VERSION}"
          echo "Main: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
          echo "HACS: https://github.com/${HACS_REPO}/releases/tag/${VERSION}"
