name: Finalize Ethernet Stability 3.1.17 Package

on:
  push:
    branches:
      - feat/ethernet-eee-stability-3.1.17

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ !contains(github.event.head_commit.message, 'generated: finalize SBC5 3.1.17 package') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ethernet-eee-stability-3.1.17
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Add Ethernet guard to local-update manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = root / 'update-manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          rel = 'local_apps/sbc5_control_center/ethernet_guard.py'
          data['files'][rel] = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          data['files'] = dict(sorted(data['files'].items()))
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"Added {rel}: {data['files'][rel]}")
          PY

      - name: Run Ethernet guard tests
        run: python scripts/test_ethernet_stability.py

      - name: Strict manifest validation
        run: python scripts/validate_release.py --strict-manifest-hashes

      - name: Build and verify local update ZIP
        run: python scripts/build_local_update.py --output /tmp/sbc5-control-center-3.1.17.zip

      - name: Commit finalized package manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git diff --cached --check
          git commit -m "generated: finalize SBC5 3.1.17 package"
          git push origin HEAD:feat/ethernet-eee-stability-3.1.17
