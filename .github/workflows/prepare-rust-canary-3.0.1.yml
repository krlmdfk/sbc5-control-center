name: Prepare Rust Canary 3.0.1

on:
  push:
    branches:
      - test/rust-3.0.0-canary
    paths:
      - .github/workflows/prepare-rust-canary-3.0.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rust-3.0.0-canary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare canary 3.0.1
        run: >-
          python scripts/release_prepare.py
          --version 3.0.1
          --release-date 2026-10-26
          --restart-required none
          --summary-en "Rust canary validation build fixing persistence of the complete migrated Supervisor option set across App restarts."
          --summary-pl "Testowy build Rust canary naprawiający trwałość pełnego zestawu opcji zmigrowanych do Supervisor po restartach aplikacji."
          --fixed-en "Persist the complete imported option tree to the target canary Supervisor store before migration guard finalization."
          --fixed-en "Preserve imported 49°C custom1, AI Assist and other migrated App options across canary container restarts."
          --fixed-pl "Zapisuj pełne drzewo zaimportowanych opcji do trwałego magazynu Supervisor canary przed finalizacją guardu migracji."
          --fixed-pl "Zachowuj po restartach canary zmigrowane ustawienia custom1 49°C, AI Assist oraz pozostałe opcje aplikacji."
          --security-en "Stable 2.8.34 and main are unchanged; this build remains isolated to the manual experimental Rust canary."
          --security-pl "Stabilna 2.8.34 i main pozostają bez zmian; build jest nadal odizolowany do ręcznej eksperymentalnej Rust canary."
      - name: Keep canary identity and validate
        run: |
          grep -q '^slug: rust_canary_sbc5_control_center$' local_apps/sbc5_control_center/config.yaml
          grep -q '^boot: manual$' local_apps/sbc5_control_center/config.yaml
          grep -q '^stage: experimental$' local_apps/sbc5_control_center/config.yaml
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          python scripts/validate_release.py --strict-manifest-hashes
      - name: Remove one-shot workflows and commit
        run: |
          rm -f .github/workflows/patch-canary-options-persistence.yml
          rm -f .github/workflows/prepare-rust-canary-3.0.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Rust canary 3.0.1 options persistence retest"
          git push origin HEAD:test/rust-3.0.0-canary
