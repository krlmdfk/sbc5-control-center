name: One-shot SBC5 3.1.5 patch

on:
  push:
    branches:
      - feature/3.1.5-thermal-predictor-shadow-assist

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip oneshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.1.5-thermal-predictor-shadow-assist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: |
          python scripts/_oneshot_patch_3_1_5.py
          git checkout HEAD -- .github/workflows/validate.yml
      - run: |
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          bash -n local_apps/sbc5_control_center/run.sh
          python scripts/test_thermal_predictor_shadow.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add Thermal Predictor Shadow Assist [skip oneshot]'
          git push origin HEAD:feature/3.1.5-thermal-predictor-shadow-assist
