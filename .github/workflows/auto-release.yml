name: Auto release after green CI

on:
  workflow_run:
    workflows: ["Validate build"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("local_apps/sbc5_control_center/release.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f "RELEASE_NOTES_${version}.md"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $version already exists and is immutable; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Strict release validation
        if: steps.version.outputs.exists != 'true'
        run: python scripts/validate_release.py --strict-manifest-hashes

      - name: Build verified local update package
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/build_local_update.py --output "SBC5_UPDATE_${VERSION}.zip"

      - name: Create immutable tag and GitHub Release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="SBC5_UPDATE_${VERSION}.zip"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "SBC5 Control Center $VERSION"
            git push origin "$VERSION"
          fi
          gh release create "$VERSION" \
            --verify-tag \
            --title "SBC5 Control Center $VERSION" \
            --notes-file "RELEASE_NOTES_${VERSION}.md" \
            "$ASSET"
