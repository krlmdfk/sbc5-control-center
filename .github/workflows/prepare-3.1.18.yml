name: Prepare SBC5 3.1.18

on:
  push:
    branches:
      - fix/eee-persistence-fan-profile-3.1.18
    paths:
      - scripts/prepare_ethernet_persistence_3_1_18.py
      - .github/workflows/prepare-3.1.18.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare source fixes
        run: python scripts/prepare_ethernet_persistence_3_1_18.py
      - name: Prepare professional release metadata
        run: >-
          python scripts/release_prepare.py
          --version 3.1.18
          --restart-required none
          --summary-en "Persist Ethernet EEE choices across host reboots and correct userspace-managed custom1 fan profile status."
          --summary-pl "Utrwalono wybór Ethernet EEE po restartach hosta i poprawiono status profilu custom1 zarządzanego przez Adaptive PWM."
          --fixed-en "Persist Ethernet EEE settings in a dedicated /data state so Supervisor-restored defaults cannot revert EEE after host reboot."
          --fixed-en "Report custom1 + runtime custom + 1% grid + Adaptive PWM as active_runtime_managed instead of a false pending_host_reboot."
          --fixed-en "Report actual Ethernet guard startup state and relay guard logs to the main App log while retaining the dedicated guard log."
          --fixed-pl "Zapisano ustawienia Ethernet EEE w osobnym trwałym stanie /data, dzięki czemu domyślne opcje odtworzone przez Supervisor nie cofają EEE po restarcie hosta."
          --fixed-pl "Dla custom1 + runtime custom + siatki 1% + Adaptive PWM raportowany jest active_runtime_managed zamiast fałszywego pending_host_reboot."
          --fixed-pl "Start Ethernet Guard pokazuje faktyczny żądany stan, a log guardu trafia także do głównego logu aplikacji przy zachowaniu osobnego logu diagnostycznego."
          --performance-en "Keep Ethernet monitoring file-based and event-light; no additional Home Assistant network polling is introduced."
          --performance-pl "Diagnostyka Ethernet pozostaje lekka i plikowa; nie dodano dodatkowego odpytywania sieci przez Home Assistant."
      - name: Run Ethernet regression tests
        run: python scripts/test_ethernet_stability.py
      - name: Run runtime regression tests
        run: python scripts/test_runtime_robustness.py
      - name: Run fan-profile regression tests
        run: python scripts/test_fan_profile_active_slot_overlay.py
      - name: Strict release validation
        run: python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit prepared 3.1.18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SBC5 Control Center 3.1.18 — persist EEE and fix runtime fan status"
          git push origin HEAD:fix/eee-persistence-fan-profile-3.1.18
