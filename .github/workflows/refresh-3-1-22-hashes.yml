name: Refresh SBC5 3.1.22 hashes

on:
  push:
    branches: ["hotfix/3.1.22-docker-build"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/3.1.22-docker-build
          fetch-depth: 0
      - name: Refresh strict update manifest hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p = Path('update-manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for raw in list(data.get('files', {})):
              f = Path(raw)
              if not f.is_file():
                  raise SystemExit(f'manifest file missing: {raw}')
              data['files'][raw] = hashlib.sha256(f.read_bytes()).hexdigest()
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit refreshed hashes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "krlmdfk"
          git config user.email "82178819+krlmdfk@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "chore: refresh 3.1.22 manifest hashes"
          git push origin HEAD:hotfix/3.1.22-docker-build
