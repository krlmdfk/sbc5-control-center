name: Prepare SBC5 3.1.29 release

on:
  push:
    branches:
      - build/3.1.29-thermal-stability

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'SBC5 Control Center 3.1.29 — thermal control stability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Add 3.1.29 files to verified update allow-list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('update-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          files = data.setdefault('files', {})
          for rel in (
              'local_apps/sbc5_control_center/thermal_control_filter.py',
              'local_apps/sbc5_control_center/patch_thermal_stability_3_1_29.py',
              'scripts/test_thermal_stability_3_1_29.py',
          ):
              files.setdefault(rel, 'pending')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Prepare professional bilingual 3.1.29 release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.29 \
            --release-date 2026-10-31 \
            --restart-required none \
            --summary-en 'Stabilize Adaptive PWM and Thermal Predictor decisions with a raw-versus-control temperature path, spike filtering, asymmetric smoothing, 30/120-second trend confirmation and direction hysteresis.' \
            --summary-pl 'Stabilizuje decyzje Adaptive PWM i Thermal Predictora przez rozdzielenie temperatury surowej i sterującej, filtr pików, asymetryczne wygładzanie, potwierdzanie trendu 30/120 s oraz bezwładność zmiany kierunku.' \
            --added-en 'Add T_raw/T_control diagnostics, 30/120-second thermal trends, signal quality, spike rejection and confirmed thermal direction to Adaptive PWM runtime state.' \
            --added-pl 'Dodaje diagnostykę T_raw/T_control, trendy termiczne 30/120 s, jakość sygnału, odrzucanie pików i potwierdzony kierunek termiczny do stanu runtime Adaptive PWM.' \
            --changed-en 'Use median-of-3 plus asymmetric EWMA for normal Adaptive PWM control while preserving raw CPU temperature as the authoritative safety and emergency signal.' \
            --changed-pl 'W zwykłym sterowaniu Adaptive PWM używa mediany z 3 próbek i asymetrycznego EWMA, zachowując surową temperaturę CPU jako nadrzędny sygnał bezpieczeństwa i awaryjnego handoffu.' \
            --changed-en 'Require Thermal Predictor forecast direction to agree with robust short/long temperature trends before a guided PWM correction is allowed.' \
            --changed-pl 'Wymaga zgodności kierunku prognozy Thermal Predictora z odpornymi trendami krótkim i długim przed dopuszczeniem korekty PWM.' \
            --fixed-en 'Prevent isolated temperature spikes and short cooling dips from causing rapid PWM direction reversals or unnecessary fan hunting near the target.' \
            --fixed-pl 'Ogranicza wpływ pojedynczych pików temperatury i krótkich spadków na szybkie odwracanie kierunku PWM oraz oscylacje wentylatora w pobliżu temperatury docelowej.' \
            --performance-en 'Reuse the existing 10-second Adaptive PWM cycle; no additional background polling loop is introduced.' \
            --performance-pl 'Wykorzystuje istniejący 10-sekundowy cykl Adaptive PWM; nie dodaje nowej pętli odpytywania w tle.'

      - name: Validate 3.1.29 thermal stability
        run: |
          python scripts/test_thermal_stability_3_1_29.py
          python scripts/test_thermal_predictor_guided_3_1_21.py
          python scripts/test_dockerfile_runtime_paths.py
          python scripts/validate_release.py --strict-manifest-hashes

      - name: Commit generated release surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SBC5 Control Center 3.1.29 — thermal control stability'
          git push origin HEAD:build/3.1.29-thermal-stability
