name: One-shot Predictor v2 calibration

on:
  push:
    paths:
      - 'scripts/_oneshot_predictor_v2_3_1_6.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/3.1.6-predictor-accuracy-calibration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Predictor v2 patch
        run: python scripts/_oneshot_predictor_v2_3_1_6.py

      - name: Validate predictor tests
        run: |
          python scripts/test_thermal_predictor_accuracy.py
          python scripts/test_thermal_predictor_shadow.py
          python -m compileall -q local_apps/sbc5_control_center/ai_cooling.py scripts/test_thermal_predictor_accuracy.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local_apps/sbc5_control_center/ai_cooling.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: calibrate Thermal Predictor v2 accuracy [predictor-v2]'
          git push origin HEAD:feature/3.1.6-predictor-accuracy-calibration
