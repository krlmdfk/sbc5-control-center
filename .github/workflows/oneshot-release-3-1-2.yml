name: One-shot release 3.1.2
on:
  push:
    branches: [fix/3.1.2-predictor-card-mac-restart]
    paths: [.github/workflows/oneshot-release-3-1-2.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.2-predictor-card-mac-restart
          fetch-depth: 0
      - name: Prepare 3.1.2
        run: |
          python scripts/release_prepare.py \
            --version 3.1.2 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Fix AI Thermal Predictor delivery, Lovelace card version synchronization and Raspberry Pi network identity." \
            --summary-pl "Naprawa udostępniania AI Thermal Predictor, synchronizacji wersji kart Lovelace i identyfikacji sieciowej Raspberry Pi." \
            --changed-en "AI Thermal Predictor recorder entities are now owned by the native SBC5 integration and reuse the existing AI runtime relay without an additional polling loop." \
            --changed-pl "Encje Recordera AI Thermal Predictor są teraz obsługiwane przez natywną integrację SBC5 i korzystają z istniejącego przekaźnika AI runtime bez dodatkowej pętli odpytywania." \
            --fixed-en "Fixed browser-session Lovelace synchronization so runtime templates normalize Card UI, Update Card and SBC5CC version markers to the installed release." \
            --fixed-pl "Naprawiono synchronizację Lovelace przez sesję przeglądarki: znaczniki wersji Card UI, Update Card i SBC5CC są normalizowane do zainstalowanego wydania." \
            --fixed-en "Fixed the stale 2.8.34 Update Card marker that caused verification rollback after a successful 3.1.1 update." \
            --fixed-pl "Naprawiono stary znacznik Update Card 2.8.34, który powodował rollback weryfikacji po poprawnej aktualizacji 3.1.1." \
            --fixed-en "Raspberry Pi device identity now uses the physical host network interface instead of ephemeral App/container MAC addresses." \
            --fixed-pl "Identyfikacja urządzenia Raspberry Pi korzysta teraz z fizycznego interfejsu sieciowego hosta zamiast zmiennych adresów MAC aplikacji/kontenera." \
            --fixed-en "Device Registry migration replaces accumulated stale MAC connections with the single verified host MAC." \
            --fixed-pl "Migracja Device Registry zastępuje nagromadzone stare połączenia MAC jednym zweryfikowanym adresem MAC hosta." \
            --performance-en "No new high-frequency polling loop was added; Predictor sensors reuse the existing 15-second native coordinator and AI runtime relay." \
            --performance-pl "Nie dodano nowej pętli szybkiego odpytywania; sensory Predictora wykorzystują istniejący 15-sekundowy koordynator natywny i przekaźnik AI runtime."
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/oneshot-release-3-1-2.yml'
          git commit -m "release: prepare SBC5 Control Center 3.1.2"
          git push origin HEAD:fix/3.1.2-predictor-card-mac-restart
