name: one-shot sync bridge 3.1.3
on:
  push:
    branches:
      - fix/3.1.3-restart-predictor-diagnostics
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.3-restart-predictor-diagnostics
      - name: Sync canonical integration to bundled bridge
        run: cp custom_components/sbc5_control_center/sensor.py local_apps/sbc5_control_center/bridge/sensor.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local_apps/sbc5_control_center/bridge/sensor.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: sync bundled integration sensor diagnostics'
          git push origin HEAD:fix/3.1.3-restart-predictor-diagnostics
