name: Sync SBC5 App with HACS Integration 3.1.34

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-integration-3-1-34.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Copy reviewed HACS integration code from tagged release
        run: |
          git clone --quiet --depth 1 --branch 3.1.34 --single-branch \
            https://github.com/krlmdfk/sbc5-control-center-integration.git /tmp/sbc5-integration-3-1-34
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          source = Path('/tmp/sbc5-integration-3-1-34/custom_components/sbc5_control_center/__init__.py')
          target = Path('custom_components/sbc5_control_center/__init__.py')
          code = source.read_text(encoding='utf-8')
          assert 'entry.platform != "template"' in code, 'Missing HACS reviewer fix'
          assert 'entry.platform == DOMAIN:\n                continue' not in code, 'Old unscoped cleanup is present'
          shutil.copyfile(source, target)
          print('Reviewed HACS 3.1.34 migration copied into canonical app integration')
          PYCODE

      - name: Prepare synchronized App 3.1.34 release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.34 \
            --release-date 2026-11-03 \
            --restart-required none \
            --summary-en 'Synchronize the SBC5 App and bundled integration with reviewed HACS Integration 3.1.34; protect other integrations from AI predictor migration cleanup.' \
            --summary-pl 'Synchronizacja aplikacji SBC5 i dołączonej integracji z HACS 3.1.34; ochrona encji innych integracji podczas migracji AI Predictora.' \
            --fixed-en 'Restrict AI Thermal Predictor migration to exact unique IDs owned by the legacy template platform; never remove unrelated integrations.' \
            --fixed-pl 'Ograniczono migrację AI Thermal Predictora do identyfikatorów legacy platformy template; bez usuwania encji innych integracji.' \
            --changed-en 'Align App runtime metadata, package, Card UI, embedded integration, release notes and update-manifest hashes with HACS 3.1.34.' \
            --changed-pl 'Ujednolicono metadane runtime, pakiet, Card UI, zintegrowany kod, notatki wydania i sumy kontrolne z HACS 3.1.34.'

      - name: Validate synchronized release and runtime regressions
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_restart_manager_hacs_handoff.py
          python scripts/test_setpoint_stability_3_1_32.py

      - name: Commit synchronized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes: app is already synchronized.'
          else
            git commit -m 'Release SBC5 Control Center 3.1.34 synced with HACS migration fix'
            git push origin HEAD:main
          fi

      - name: Publish synchronized App release and local update ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 3.1.34
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/build_local_update.py --output "SBC5_UPDATE_${VERSION}.zip"
          git tag -a "$VERSION" -m "SBC5 Control Center $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag \
            --title "SBC5 Control Center $VERSION" \
            --notes-file "RELEASE_NOTES_${VERSION}.md" \
            "SBC5_UPDATE_${VERSION}.zip"
