name: Prepare 3.0.4 one-shot

on:
  push:
    branches:
      - maintenance/3.0.4-audit

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/3.0.4-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Apply polling optimization
        run: python scripts/prepare_3_0_4_polling_optimization.py
      - name: Prepare release metadata
        run: >-
          python scripts/release_prepare.py
          --version 3.0.4
          --restart-required none
          --summary-en "Lower steady-state polling overhead without changing cooling control cadence."
          --summary-pl "Zmniejszono stałe obciążenie pollingiem bez zmiany częstotliwości sterowania chłodzeniem."
          --performance-en "Raised the effective Config.txt Manager watchdog floor from 5 seconds to 30 seconds while preserving immediate event-driven UI reloads."
          --performance-pl "Podniesiono efektywne minimum watchdoga Config.txt Manager z 5 do 30 sekund, zachowując natychmiastowe przeładowanie po zapisie z UI."
          --performance-en "Reduced compact AI relay signature checks from every 15 seconds to every 30 seconds; the AI evaluator remains at 10 seconds."
          --performance-pl "Zmniejszono częstotliwość sprawdzania podpisu kompaktowego relay AI z 15 do 30 sekund; evaluator AI nadal działa co 10 sekund."
          --changed-en "Default Config.txt Manager sync interval is now 30 seconds; existing values below 30 seconds remain accepted for compatibility but are clamped to a 30-second runtime watchdog."
          --changed-pl "Domyślny interwał synchronizacji Config.txt Manager wynosi teraz 30 sekund; starsze wartości poniżej 30 sekund pozostają akceptowane dla zgodności, ale runtime stosuje minimum 30 sekund."
      - name: Validate Bash and Python
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Validate release and regression tests
        run: |
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
      - name: Rust release check
        working-directory: local_apps/sbc5_control_center/rust-core
        run: cargo check --release
      - name: Remove one-shot tooling and commit
        run: |
          rm -f scripts/prepare_3_0_4_polling_optimization.py .github/workflows/prepare-3.0.4.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SBC5 Control Center 3.0.4 — polling I/O optimization"
          git push origin HEAD:maintenance/3.0.4-audit
