name: one-shot 3.1.3 patch
on:
  push:
    branches:
      - fix/3.1.3-restart-predictor-diagnostics
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.3-restart-predictor-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_oneshot_patch_3_1_3.py
      - name: Regenerate card JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          src=Path('dashboard/sbc5_control_center_diagnostics_card.yaml')
          dst=Path('local_apps/sbc5_control_center/dashboard_card.json')
          obj=yaml.safe_load(src.read_text(encoding='utf-8'))
          dst.write_text(json.dumps(obj, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local_apps/sbc5_control_center/run_legacy.sh local_apps/sbc5_control_center/ai_cooling.py custom_components/sbc5_control_center/sensor.py dashboard/sbc5_control_center_diagnostics_card.yaml local_apps/sbc5_control_center/dashboard_card.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reconcile restart marker and expose predictor quality diagnostics'
          git push origin HEAD:fix/3.1.3-restart-predictor-diagnostics
