name: Prepare SBC5 3.0.3

on:
  push:
    branches:
      - maintenance/3.0.3
    paths:
      - .github/workflows/prepare-3.0.3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Apply runtime logging optimization
        run: python scripts/prepare_3_0_3_log_optimization.py
      - name: Prepare unified release metadata
        run: >-
          python scripts/release_prepare.py
          --version 3.0.3
          --release-date 2026-10-27
          --restart-required none
          --summary-en "Reduce steady-state log I/O while preserving Adaptive PWM and AI execution cadence."
          --summary-pl "Ograniczenie I/O logów w stanie ustalonym bez zmiany częstotliwości działania Adaptive PWM i AI."
          --performance-en "Sample routine Adaptive PWM write logs while preserving immediate safety/action logs and unchanged 10-second control execution."
          --performance-pl "Próbkowanie rutynowych logów zapisów Adaptive PWM przy zachowaniu natychmiastowych logów bezpieczeństwa i niezmienionego cyklu sterowania 10 s."
          --performance-en "Reduce AI Cooling steady-state logging to state/model changes plus a 5-minute keepalive; evaluator cadence remains unchanged."
          --performance-pl "Ograniczenie logów AI Cooling w stanie ustalonym do zmian stanu/modelu i 5-minutowego keepalive; częstotliwość ewaluatora pozostaje bez zmian."
          --changed-en "Expose the effective control-log sampling and AI-log keepalive policy in the startup Performance line."
          --changed-pl "Pokazanie efektywnej polityki próbkowania logów regulatora i keepalive AI w linii Performance przy starcie."
          --security-en "Safety-critical ownership, write-failure, fast-response and sign-guard logs remain immediate."
          --security-pl "Krytyczne logi ownership, błędów zapisu, szybkiej reakcji i sign-guard pozostają natychmiastowe."
      - name: Validate candidate
        run: |
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          bash -n local_apps/sbc5_control_center/run.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          python scripts/validate_release.py
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          git diff --check
      - name: Commit candidate and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/prepare-3.0.3.yml scripts/prepare_3_0_3_log_optimization.py
          git commit -m "Prepare SBC5 Control Center 3.0.3 log I/O optimization"
          git push origin HEAD:maintenance/3.0.3
