name: One-shot native predictor 3.1.2
on:
  push:
    branches: [fix/3.1.2-predictor-card-mac-restart]
    paths: [.github/workflows/oneshot-native-predictor-3-1-2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.1.2-predictor-card-mac-restart
          fetch-depth: 0
      - run: python scripts/_oneshot_native_predictor_3_1_2.py
      - run: python -m compileall -q custom_components/sbc5_control_center
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sbc5_control_center
          git commit -m "fix: keep bundled integration aligned with native predictor"
          git push origin HEAD:fix/3.1.2-predictor-card-mac-restart
