name: Prepare SBC5 3.0.2

on:
  push:
    branches:
      - maintenance/3.0.2
    paths:
      - scripts/prepare_3_0_2_runtime.py
      - .github/workflows/prepare-3.0.2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Apply runtime optimization
        run: python scripts/prepare_3_0_2_runtime.py
      - name: Prepare unified release
        run: >-
          python scripts/release_prepare.py
          --version 3.0.2
          --release-date 2026-10-27
          --restart-required none
          --summary-en "Runtime efficiency hotfix: event-style local ZIP detection and correct Supervisor profile signature comparison eliminate redundant steady-state work."
          --summary-pl "Hotfix wydajności runtime: zdarzeniowe wykrywanie lokalnych ZIP i poprawne porównanie podpisu profili Supervisor eliminują zbędną pracę w stanie ustalonym."
          --fixed-en "Canonicalized Supervisor profile signatures so unchanged native profile options no longer trigger false imports every reconciliation cycle."
          --fixed-pl "Ujednolicono podpisy profili Supervisor, dzięki czemu niezmienione opcje natywne nie wywołują już pozornego importu w każdym cyklu uzgadniania."
          --performance-en "Replaced full local ZIP parsing every two minutes with a lightweight filename/size/mtime signature; full ZIP validation now runs only when the local update directory actually changes."
          --performance-pl "Zastąpiono pełne parsowanie lokalnych ZIP co dwie minuty lekkim podpisem nazwa/rozmiar/mtime; pełna walidacja ZIP uruchamia się tylko po rzeczywistej zmianie katalogu aktualizacji."
          --performance-en "Adaptive PWM, AI Cooling, fan calibration and the verified 49°C boot curve are unchanged."
          --performance-pl "Adaptive PWM, AI Cooling, kalibracja wentylatora i zweryfikowana krzywa boot 49°C pozostają bez zmian."
      - name: Validate shell and Python
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Runtime regression tests
        run: |
          python scripts/test_migration_profile_guard.py
          python scripts/test_canary_migration.py
          python scripts/test_runtime_robustness.py
          python scripts/validate_release.py --strict-manifest-hashes
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Prepare SBC5 Control Center 3.0.2"
          git push origin HEAD:maintenance/3.0.2
