name: Prepare SBC5 3.1.7

on:
  push:
    branches:
      - release/3.1.7-ai-bucket-thermal-fastpath

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[3.1.7 prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Apply 3.1.7 source changes
        run: python scripts/prepare_3_1_7.py

      - name: Prepare unified bilingual release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.7 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Improve AI Cooling learning for medium/high workloads and accelerate safe fan response during large thermal excursions." \
            --summary-pl "Poprawa uczenia AI Cooling dla obciążeń medium/high oraz szybsza, bezpieczna reakcja wentylatora przy dużym odchyleniu temperatury." \
            --changed-en "AI Cooling qualification is bucket-aware: bucket transitions reset only short stability windows while learned bins, counters and confidence remain preserved." \
            --changed-pl "Kwalifikacja AI Cooling jest zależna od bucketa: przejście między bucketami zeruje wyłącznie krótkie okna stabilności, a wyuczone biny, liczniki i confidence pozostają zachowane." \
            --changed-en "Medium/high use workload-specific temperature, slope and PWM quality limits while idle/low retain the stricter steady-state gates." \
            --changed-pl "Medium/high używają limitów jakości temperatury, trendu i PWM dopasowanych do obciążenia, a idle/low zachowują bardziej rygorystyczne kryteria stanu ustalonego." \
            --changed-en "Adaptive PWM adds an upward-only thermal fast path: up to +8 pp per cycle from target+5C and +12 pp per cycle from target+7C; downward slew is unchanged." \
            --changed-pl "Adaptive PWM otrzymuje thermal fast path wyłącznie w górę: do +8 pp/cykl od target+5C i +12 pp/cykl od target+7C; tempo zmniejszania PWM pozostaje bez zmian." \
            --fixed-en "Prevent low-load qualification history from contaminating medium/high windows, which could leave higher workload buckets with observations but zero qualified samples." \
            --fixed-pl "Usunięto wpływ historii kwalifikacji z niskiego obciążenia na okna medium/high, który mógł pozostawiać wyższe buckety z obserwacjami, ale bez próbek jakościowych." \
            --fixed-en "Restart Manager cards now identify whether a pending restart comes from CPU/OC, GPU, cooling/Device Tree, boot configuration, the current update, or an earlier independent request." \
            --fixed-pl "Karty Restart Managera wskazują, czy oczekujący restart pochodzi z CPU/OC, GPU, chłodzenia/Device Tree, konfiguracji boot, bieżącej aktualizacji czy wcześniejszego niezależnego żądania." \
            --performance-en "No new polling loop is added; bucket-aware qualification reuses the existing 10-second AI evaluator and preserves the current durable checkpoint cadence." \
            --performance-pl "Nie dodano nowej pętli pollingowej; kwalifikacja zależna od bucketa wykorzystuje istniejący evaluator AI co 10 s i zachowuje dotychczasową częstotliwość trwałych checkpointów."

      - name: Validate shell and Python
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh
          python -m compileall -q custom_components/sbc5_control_center local_apps/sbc5_control_center scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Run regression tests
        run: |
          python scripts/test_ai_bucket_qualification_v4.py
          python scripts/test_runtime_robustness.py
          python scripts/test_thermal_predictor_shadow.py
          python scripts/test_thermal_predictor_accuracy.py
          python scripts/validate_release.py --strict-manifest-hashes
          git diff --check

      - name: Commit prepared release branch
        run: |
          git config user.name "SBC5 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "SBC5 Control Center 3.1.7 — bucket-aware AI learning and thermal fast path [3.1.7 prepared]"
          git push origin HEAD:release/3.1.7-ai-bucket-thermal-fastpath
