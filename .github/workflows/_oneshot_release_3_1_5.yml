name: One-shot SBC5 3.1.5 release prepare

on:
  push:
    branches:
      - feature/3.1.5-thermal-predictor-shadow-assist

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[release-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.1.5-thermal-predictor-shadow-assist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jinja2
      - name: Prepare release
        run: |
          python scripts/release_prepare.py \
            --version 3.1.5 \
            --release-date 2026-10-27 \
            --restart-required none \
            --summary-en "Add AI Thermal Predictor Shadow Assist to evaluate bounded predictive PWM corrections before control activation." \
            --summary-pl "Dodano AI Thermal Predictor Shadow Assist do oceny ograniczonych korekt predykcyjnych PWM przed aktywacją sterowania." \
            --added-en "Add Thermal Predictor Shadow Assist with hypothetical PWM correction telemetry, activation gate diagnostics and weighted 30/60/120-second thermal forecast." \
            --added-pl "Dodano Thermal Predictor Shadow Assist z telemetrią hipotetycznej korekty PWM, diagnostyką bramki aktywacji i ważoną prognozą temperatury 30/60/120 s." \
            --added-en "Expose native Home Assistant Shadow Assist sensors for suggested delta, hypothetical PWM, gate state, decision reason and weighted forecast." \
            --added-pl "Udostępniono natywne sensory Home Assistant Shadow Assist: sugerowana delta, hipotetyczny PWM, stan bramki, powód decyzji i prognoza ważona." \
            --changed-en "Gate future predictive control on automatic mode, good/excellent Predictor quality, confidence >=80%, average MAE <=1.25 C and at least 8 validated forecasts per horizon." \
            --changed-pl "Przyszłe sterowanie predykcyjne jest blokowane do czasu spełnienia warunków: tryb automatyczny, jakość Predictora good/excellent, confidence >=80%, średnie MAE <=1,25 C i co najmniej 8 zweryfikowanych prognoz na każdy horyzont." \
            --changed-en "Bound every Shadow Assist recommendation to +/-2 percentage points and prevent negative prediction corrections while temperature trend is rising." \
            --changed-pl "Każda rekomendacja Shadow Assist jest ograniczona do +/-2 pp, a ujemna korekta predykcyjna jest blokowana przy rosnącym trendzie temperatury." \
            --performance-en "Reuse the existing AI evaluator, thermal windows, relay and Home Assistant coordinator; no new polling loop or control write path is added." \
            --performance-pl "Wykorzystano istniejący evaluator AI, okna termiczne, relay i koordynator Home Assistant; nie dodano nowej pętli pollingowej ani ścieżki zapisu sterowania." \
            --security-en "Shadow Assist remains telemetry-only: control_output_enabled=false; Adaptive PWM and AI Cooling remain authoritative and all physical fan writes are unchanged." \
            --security-pl "Shadow Assist pozostaje wyłącznie telemetrią: control_output_enabled=false; Adaptive PWM i AI Cooling pozostają nadrzędne, a fizyczne zapisy wentylatora nie zostały zmienione."
      - name: Verify shadow safety
        run: python scripts/test_thermal_predictor_shadow.py
      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/_oneshot_release_3_1_5.yml'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: prepare SBC5 3.1.5 Shadow Assist [release-prepared]'
          git push origin HEAD:feature/3.1.5-thermal-predictor-shadow-assist
