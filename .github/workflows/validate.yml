name: Validate build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Prepare 3.1.12 release once
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger 3.1.12 release preparation'
        run: |
          python scripts/release_prepare.py \
            --version 3.1.12 \
            --release-date 2026-10-28 \
            --restart-required none \
            --summary-en "Expose AI Cooling v5.1 transient-learning evidence through the existing transfer diagnostics path without changing cooling behavior or adding polling." \
            --summary-pl "Udostępnia diagnostykę uczenia transient AI Cooling v5.1 przez istniejącą ścieżkę transferu bez zmiany sterowania chłodzeniem i bez dodatkowego pollingu." \
            --fixed-en "Expose transient confidence, sample count and support in the existing transfer_source telemetry token so medium/high burst learning is visible end to end." \
            --fixed-en "Keep the existing 22-field evaluator ABI intact; no run_legacy parser expansion or new telemetry loop is required." \
            --fixed-pl "Udostępniono pewność transient, liczbę próbek i support w istniejącym tokenie transfer_source, dzięki czemu uczenie z krótkich obciążeń medium/high jest widoczne end-to-end." \
            --fixed-pl "Zachowano istniejące 22-polowe ABI ewaluatora; nie rozszerzano parsera run_legacy ani nie dodawano nowej pętli telemetrii." \
            --performance-en "No additional polling, Home Assistant REST reads or control-loop work is introduced." \
            --performance-pl "Nie dodano pollingu, odczytów REST Home Assistant ani dodatkowej pracy w pętli sterowania."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare SBC5 Control Center 3.1.12"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Validate Bash
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh

      - name: Compile Python
        run: |
          python -m compileall -q \
            custom_components/sbc5_control_center \
            local_apps/sbc5_control_center \
            scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate repository consistency
        run: python scripts/validate_release.py

      - name: Test migration profile guard
        run: python scripts/test_migration_profile_guard.py

      - name: Test canary migration handoff
        run: python scripts/test_canary_migration.py

      - name: Test runtime robustness
        run: python scripts/test_runtime_robustness.py

      - name: Test Thermal Predictor Shadow Assist
        run: python scripts/test_thermal_predictor_shadow.py

      - name: Test Thermal Predictor Accuracy Calibration
        run: python scripts/test_thermal_predictor_accuracy.py

      - name: Test AI bucket-aware qualification and thermal fast path
        run: python scripts/test_ai_bucket_qualification_v4.py

      - name: Test AI Cooling hierarchical continuous learning v5
        run: python scripts/test_ai_hierarchical_v5.py

      - name: Test Restart Manager HACS handoff
        run: python scripts/test_restart_manager_hacs_handoff.py

      - name: Test AI v5 observability and log cleanup
        run: python scripts/test_ai_v5_observability.py

      - name: Test AI Cooling v5.1 transient learning guards
        run: python scripts/test_ai_v5_1_transient_learning.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
