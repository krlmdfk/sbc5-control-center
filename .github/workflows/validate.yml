name: Validate build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Validate Bash
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh

      - name: Compile Python
        run: |
          python -m compileall -q \
            custom_components/sbc5_control_center \
            local_apps/sbc5_control_center \
            scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate repository consistency
        run: python scripts/validate_release.py

      - name: Verify strict HACS candidate code parity (PR 36)
        run: python scripts/check_companion_parity.py --role app --hacs-ref safety/3-2-1-namespace-ownership-parity

      - name: Validate Dockerfile runtime paths
        run: python scripts/test_dockerfile_runtime_paths.py

      - name: Test release ZIP runtime dependency coverage
        run: python scripts/test_update_zip_runtime_completeness.py

      - name: Test read-only AI model diagnostics
        run: python scripts/test_ai_model_readonly_diagnostics.py

      - name: Dry-run offline ZIP with refreshed manifest (never publish/install)
        run: |
          python scripts/update_manifest_hashes.py
          python scripts/validate_release.py --strict-manifest-hashes
          python scripts/build_local_update.py --output "$RUNNER_TEMP/SBC5_OFFLINE_CI_INSPECTION_ONLY.zip"
          python scripts/build_local_update.py --verify-only --output "$RUNNER_TEMP/SBC5_OFFLINE_CI_INSPECTION_ONLY.zip"
          python local_apps/sbc5_control_center/zip_security_preflight.py "$RUNNER_TEMP/SBC5_OFFLINE_CI_INSPECTION_ONLY.zip"
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path
          manifest = json.loads(Path("update-manifest.json").read_text())
          release = json.loads(Path("local_apps/sbc5_control_center/release.json").read_text())
          assert manifest["version"] == release["version"], (
              "Offline CI cannot unexpectedly change release version",
              manifest["version"], release["version"],
          )
          path = Path(os.environ["RUNNER_TEMP"]) / "SBC5_OFFLINE_CI_INSPECTION_ONLY.zip"
          with zipfile.ZipFile(path) as archive:
              members = set(archive.namelist())
              for item in (
                  "local_apps/sbc5_control_center/ai_model_lock.py",
                  "local_apps/sbc5_control_center/zip_security_preflight.py",
                  "local_apps/sbc5_control_center/ai_cooling_v5.py",
                  "local_apps/sbc5_control_center/ai_cooling_v5_1.py",
                  "local_apps/sbc5_control_center/thermal_effectiveness.py",
              ):
                  assert item in members, f"Offline ZIP missing required runtime dependency: {item}"
          print("OFFLINE CI ZIP self-verification: PASS; not an installable release")
          PY

      - name: Test migration profile guard
        run: python scripts/test_migration_profile_guard.py

      - name: Test Ethernet EEE stability and persistence
        run: python scripts/test_ethernet_stability.py

      - name: Test canary migration handoff
        run: python scripts/test_canary_migration.py

      - name: Test 3.2.0 to 3.2.1-rc2 model-safe canary upgrade
        run: python scripts/test_upgrade_3_2_1_model_preservation.py

      - name: Test full v5.2 evaluator persistence across process restarts
        run: python scripts/test_ai_v5_2_process_restart_persistence.py

      - name: Test runtime robustness
        run: python scripts/test_runtime_robustness.py

      - name: Test Card UI pre-release version synchronization
        run: python scripts/test_card_ui_prerelease_sync.py

      - name: Test ZIP pre-extraction security
        run: python scripts/test_zip_security_preflight_3_2_1.py

      - name: Verify published 3.2.0 ZIP with new security preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbc5-release-zip"
          gh release download 3.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$RUNNER_TEMP/sbc5-release-zip"
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'local_apps/sbc5_control_center')
          from zip_security_preflight import validate_archive
          files = list(Path(__import__('os').environ['RUNNER_TEMP'], 'sbc5-release-zip').glob('*.zip'))
          assert len(files) == 1, f'Expected one published release ZIP, found {len(files)}'
          validate_archive(files[0])
          print(f'Published 3.2.0 ZIP security compatibility: PASS ({files[0].name})')
          PY

      - name: Test legacy registry ownership before namespace cleanup
        run: python scripts/test_migration_namespace_ownership_3_2_1.py

      - name: Test Ingress API JSON request bounds
        run: python scripts/test_config_ui_request_limits_3_2_1.py

      - name: Test Thermal Predictor Shadow Assist
        run: python scripts/test_thermal_predictor_shadow.py

      - name: Test Thermal Predictor Accuracy Calibration
        run: python scripts/test_thermal_predictor_accuracy.py

      - name: Test Thermal Predictor guided assist
        run: python scripts/test_thermal_predictor_guided_3_1_21.py

      - name: Test Thermal Predictor effectiveness persistence
        run: python scripts/test_thermal_effectiveness_persistence_3_1_26.py

      - name: Test thermal control stability and predictor confirmation
        run: python scripts/test_thermal_stability_3_1_29.py

      - name: Test SBC5 Global Edition preflight
        run: python scripts/test_global_release_readiness_3_2_0.py

      - name: Test 3.2.1 manual release publication gates
        run: python scripts/test_release_workflow_3_2_1_gates.py

      - name: Test isolated 3.2.1 diagnostic Canary safety
        run: python scripts/test_canary_3_2_1_shadow_isolation.py

      - name: Test Thermal Predictor Stability v2
        run: python scripts/test_thermal_predictor_stability_3_1_30.py

      - name: Test Thermal Predictor short-term context resets
        run: python scripts/test_thermal_guidance_context_reset.py

      - name: Test Adaptive Trim Recovery and Trend Fusion
        run: python scripts/test_adaptive_trim_recovery_3_1_31.py

      - name: Test Setpoint Stability and actuator reversal guard
        run: python scripts/test_setpoint_stability_3_1_32.py

      - name: Test AI runtime layer wiring
        run: python scripts/test_ai_runtime_wiring_3_1_20.py

      - name: Test AI runtime relay recovery after Home Assistant restart
        run: python scripts/test_ai_runtime_relay_recovery_3_1_27.py

      - name: Test AI bucket-aware qualification and thermal fast path
        run: python scripts/test_ai_bucket_qualification_v4.py

      - name: Test AI Cooling hierarchical continuous learning v5
        run: python scripts/test_ai_hierarchical_v5.py

      - name: Test AI model integrity fail-closed protection
        run: python scripts/test_ai_model_integrity.py

      - name: Test AI reset backup and integrity
        run: python scripts/test_ai_model_reset_backup.py

      - name: Test concurrent AI learning and reset transaction
        run: python scripts/test_ai_model_reset_concurrency.py

      - name: Test Restart Manager HACS handoff
        run: python scripts/test_restart_manager_hacs_handoff.py

      - name: Test AI v5 observability and log cleanup
        run: python scripts/test_ai_v5_observability.py

      - name: Validate AI output-to-PWM boundary
        run: python scripts/test_ai_output_boundary_3_2_1.py

      - name: Validate App-private AI training telemetry
        run: python scripts/test_private_ai_training_telemetry_3_2_1.py

      - name: Test AI Cooling v5.1 transient learning guards
        run: python scripts/test_ai_v5_1_transient_learning.py

      - name: Test AI Cooling v5.1 sparse-bucket direct diagnostics
        run: python scripts/test_ai_v5_1_direct_diagnostics.py

      - name: Test fan profile active-slot overlay validation
        run: python scripts/test_fan_profile_active_slot_overlay.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
