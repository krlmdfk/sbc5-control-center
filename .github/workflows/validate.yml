name: Repair 3.1.14 manifest hash

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore final production workflow
        run: git checkout origin/main -- .github/workflows/validate.yml

      - name: Rebuild manifest hashes against final tree
        run: python scripts/update_manifest_hashes.py

      - name: Commit manifest hash repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate.yml update-manifest.json
          git commit -m "fix: refresh 3.1.14 manifest hashes" || exit 0
          git push origin HEAD:fix/3.1.14-manifest-hash
