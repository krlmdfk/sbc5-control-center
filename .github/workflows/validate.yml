name: Validate build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare release 3.1.14
        if: github.ref == 'refs/heads/release/3.1.14-active-slot-overlay'
        run: |
          current="$(python -c 'import json; print(json.load(open("local_apps/sbc5_control_center/release.json"))["version"])')"
          if [ "$current" != "3.1.14" ]; then
            python scripts/release_prepare.py \
              --version 3.1.14 \
              --restart-required host \
              --summary-en "Fix Active Cooler custom overlay reconciliation after HAOS A/B slot switches." \
              --summary-pl "Naprawa aktywacji niestandardowego profilu Active Cooler po przełączeniu slotu A/B przez HAOS." \
              --fixed-en "Validate rpi5-custom1.dtbo in the currently booted HAOS RAUC slot instead of accepting a stale copy from any slot." \
              --fixed-en "Automatically rebuild the custom fan overlay when the active slot is missing it after an HAOS update." \
              --fixed-pl "Walidacja rpi5-custom1.dtbo dotyczy teraz aktualnie uruchomionego slotu RAUC HAOS, a nie dowolnej starej kopii z innego slotu." \
              --fixed-pl "Automatyczna odbudowa nakładki profilu wentylatora, gdy aktywny slot nie ma jej po aktualizacji HAOS." \
              --performance-en "No new polling loop; active-slot detection runs only during existing startup reconciliation." \
              --performance-pl "Bez nowej pętli odpytywania; wykrywanie aktywnego slotu działa wyłącznie w istniejącej fazie uzgadniania przy starcie."
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "release: prepare SBC5 Control Center 3.1.14"
            git push origin HEAD:release/3.1.14-active-slot-overlay
          fi

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Validate Bash
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh

      - name: Compile Python
        run: |
          python -m compileall -q \
            custom_components/sbc5_control_center \
            local_apps/sbc5_control_center \
            scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate repository consistency
        run: python scripts/validate_release.py

      - name: Test migration profile guard
        run: python scripts/test_migration_profile_guard.py

      - name: Test canary migration handoff
        run: python scripts/test_canary_migration.py

      - name: Test runtime robustness
        run: python scripts/test_runtime_robustness.py

      - name: Test Thermal Predictor Shadow Assist
        run: python scripts/test_thermal_predictor_shadow.py

      - name: Test Thermal Predictor Accuracy Calibration
        run: python scripts/test_thermal_predictor_accuracy.py

      - name: Test AI bucket-aware qualification and thermal fast path
        run: python scripts/test_ai_bucket_qualification_v4.py

      - name: Test AI Cooling hierarchical continuous learning v5
        run: python scripts/test_ai_hierarchical_v5.py

      - name: Test Restart Manager HACS handoff
        run: python scripts/test_restart_manager_hacs_handoff.py

      - name: Test AI v5 observability and log cleanup
        run: python scripts/test_ai_v5_observability.py

      - name: Test AI Cooling v5.1 transient learning guards
        run: python scripts/test_ai_v5_1_transient_learning.py

      - name: Test AI Cooling v5.1 sparse-bucket direct diagnostics
        run: python scripts/test_ai_v5_1_direct_diagnostics.py

      - name: Test fan profile active-slot overlay validation
        run: python scripts/test_fan_profile_active_slot_overlay.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
