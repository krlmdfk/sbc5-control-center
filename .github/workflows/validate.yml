name: Validate build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Prepare one-time synchronized 3.1.33 release
        id: sync_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          NEED_SYNC="$(python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('local_apps/sbc5_control_center/release.json').read_text())
          manifest = json.loads(Path('update-manifest.json').read_text())
          print('yes' if release.get('version') == '3.1.33' and manifest.get('version') != '3.1.33' else 'no')
          PY
          )"
          echo "needed=$NEED_SYNC" >> "$GITHUB_OUTPUT"
          if [ "$NEED_SYNC" != "yes" ]; then
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('local_apps/sbc5_control_center/release.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = '3.1.32'
          data['package_version'] = '3.1.32'
          data['card_ui_version'] = '3.1.32'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/release_prepare.py \
            --version 3.1.33 \
            --release-date 2026-11-03 \
            --restart-required none \
            --summary-en "Synchronize the SBC5 Control Center App release with the companion HACS integration 3.1.33; no runtime behavior changes." \
            --summary-pl "Synchronizacja wydania aplikacji SBC5 Control Center z integracją HACS 3.1.33; bez zmian w działaniu runtime." \
            --changed-en "Align App, package, Card UI and bundled integration version surfaces with 3.1.33." \
            --changed-pl "Ujednolica wersje aplikacji, pakietu, Card UI i dołączonej integracji do 3.1.33." \
            --fixed-en "Carry the HACS review fixes for non-blocking repair-flow file I/O and correct integration documentation/issue links into the canonical and bundled integration copies." \
            --fixed-pl "Przenosi poprawki z review HACS: nieblokujące operacje plikowe w Repairs oraz poprawne linki dokumentacji i zgłoszeń do kanonicznej i dołączonej kopii integracji."
          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          python scripts/update_manifest_hashes.py
          python scripts/validate_release.py --strict-manifest-hashes

      - name: Validate Bash
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh

      - name: Compile Python
        run: |
          python -m compileall -q \
            custom_components/sbc5_control_center \
            local_apps/sbc5_control_center \
            scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate repository consistency
        run: python scripts/validate_release.py

      - name: Validate Dockerfile runtime paths
        run: python scripts/test_dockerfile_runtime_paths.py

      - name: Test migration profile guard
        run: python scripts/test_migration_profile_guard.py

      - name: Test Ethernet EEE stability and persistence
        run: python scripts/test_ethernet_stability.py

      - name: Test canary migration handoff
        run: python scripts/test_canary_migration.py

      - name: Test runtime robustness
        run: python scripts/test_runtime_robustness.py

      - name: Test Thermal Predictor Shadow Assist
        run: python scripts/test_thermal_predictor_shadow.py

      - name: Test Thermal Predictor Accuracy Calibration
        run: python scripts/test_thermal_predictor_accuracy.py

      - name: Test Thermal Predictor guided assist
        run: python scripts/test_thermal_predictor_guided_3_1_21.py

      - name: Test Thermal Predictor effectiveness persistence
        run: python scripts/test_thermal_effectiveness_persistence_3_1_26.py

      - name: Test thermal control stability and predictor confirmation
        run: python scripts/test_thermal_stability_3_1_29.py

      - name: Test Thermal Predictor Stability v2
        run: python scripts/test_thermal_predictor_stability_3_1_30.py

      - name: Test Adaptive Trim Recovery and Trend Fusion
        run: python scripts/test_adaptive_trim_recovery_3_1_31.py

      - name: Test Setpoint Stability and actuator reversal guard
        run: python scripts/test_setpoint_stability_3_1_32.py

      - name: Test AI runtime layer wiring
        run: python scripts/test_ai_runtime_wiring_3_1_20.py

      - name: Test AI runtime relay recovery after Home Assistant restart
        run: python scripts/test_ai_runtime_relay_recovery_3_1_27.py

      - name: Test AI bucket-aware qualification and thermal fast path
        run: python scripts/test_ai_bucket_qualification_v4.py

      - name: Test AI Cooling hierarchical continuous learning v5
        run: python scripts/test_ai_hierarchical_v5.py

      - name: Test Restart Manager HACS handoff
        run: python scripts/test_restart_manager_hacs_handoff.py

      - name: Test AI v5 observability and log cleanup
        run: python scripts/test_ai_v5_observability.py

      - name: Test AI Cooling v5.1 transient learning guards
        run: python scripts/test_ai_v5_1_transient_learning.py

      - name: Test AI Cooling v5.1 sparse-bucket direct diagnostics
        run: python scripts/test_ai_v5_1_direct_diagnostics.py

      - name: Test fan profile active-slot overlay validation
        run: python scripts/test_fan_profile_active_slot_overlay.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Build synchronized local update package
        if: steps.sync_release.outputs.needed == 'yes'
        run: python scripts/build_local_update.py --output SBC5_UPDATE_3.1.33.zip

      - name: Commit synchronized release and publish 3.1.33
        if: steps.sync_release.outputs.needed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 3.1.33 — synchronize App and HACS integration"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git tag -a 3.1.33 "$RELEASE_SHA" -m "SBC5 Control Center 3.1.33"
          git push origin refs/tags/3.1.33
          gh release create 3.1.33 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "SBC5 Control Center 3.1.33" \
            --notes-file RELEASE_NOTES_3.1.33.md \
            SBC5_UPDATE_3.1.33.zip
