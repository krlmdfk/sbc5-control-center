name: Validate build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jinja2

      - name: Validate Bash
        run: |
          bash -n local_apps/sbc5_control_center/run.sh
          bash -n local_apps/sbc5_control_center/namespace_native_guard.sh
          bash -n local_apps/sbc5_control_center/run_legacy.sh

      - name: Compile Python
        run: |
          python -m compileall -q \
            custom_components/sbc5_control_center \
            local_apps/sbc5_control_center \
            scripts
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate repository consistency
        run: python scripts/validate_release.py

      - name: Validate Dockerfile runtime paths
        run: python scripts/test_dockerfile_runtime_paths.py

      - name: Test migration profile guard
        run: python scripts/test_migration_profile_guard.py

      - name: Test Ethernet EEE stability and persistence
        run: python scripts/test_ethernet_stability.py

      - name: Test canary migration handoff
        run: python scripts/test_canary_migration.py

      - name: Test runtime robustness
        run: python scripts/test_runtime_robustness.py

      - name: Test Thermal Predictor Shadow Assist
        run: python scripts/test_thermal_predictor_shadow.py

      - name: Test Thermal Predictor Accuracy Calibration
        run: python scripts/test_thermal_predictor_accuracy.py

      - name: Test Thermal Predictor guided assist
        run: python scripts/test_thermal_predictor_guided_3_1_21.py

      - name: Test Thermal Predictor effectiveness persistence
        run: python scripts/test_thermal_effectiveness_persistence_3_1_26.py

      - name: Test AI runtime layer wiring
        run: python scripts/test_ai_runtime_wiring_3_1_20.py

      - name: Test AI runtime relay recovery after Home Assistant restart
        run: python scripts/test_ai_runtime_relay_recovery_3_1_27.py

      - name: Test AI bucket-aware qualification and thermal fast path
        run: python scripts/test_ai_bucket_qualification_v4.py

      - name: Test AI Cooling hierarchical continuous learning v5
        run: python scripts/test_ai_hierarchical_v5.py

      - name: Test Restart Manager HACS handoff
        run: python scripts/test_restart_manager_hacs_handoff.py

      - name: Test AI v5 observability and log cleanup
        run: python scripts/test_ai_v5_observability.py

      - name: Test AI Cooling v5.1 transient learning guards
        run: python scripts/test_ai_v5_1_transient_learning.py

      - name: Test AI Cooling v5.1 sparse-bucket direct diagnostics
        run: python scripts/test_ai_v5_1_direct_diagnostics.py

      - name: Test fan profile active-slot overlay validation
        run: python scripts/test_fan_profile_active_slot_overlay.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check
